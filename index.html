<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic iPhone 6 - Storefront Layout Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 📱 โครงตัวเครื่อง iPhone ตามต้นฉบับเป๊ะๆ (ไม่เปลี่ยนรูปร่าง) */
        .iphone-device {
            position: relative;
            width: 375px;
            height: 750px;
            background: linear-gradient(145deg, #ffffff 0%, #ffe5ec 100%);
            border-radius: 48px;
            box-shadow: 
                0 20px 40px rgba(255, 182, 193, 0.25),
                inset 0 0 0 2px #ffffff,
                inset 0 0 0 4px #ffb3c6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .side-button {
            position: absolute;
            background: #ffb3c6;
            border-radius: 2px;
        }
        .silent-switch { left: -4px; top: 90px; width: 3px; height: 18px; }
        .volume-up { left: -4px; top: 130px; width: 3px; height: 32px; }
        .volume-down { left: -4px; top: 175px; width: 3px; height: 32px; }
        .power-button { right: -4px; top: 135px; width: 3px; height: 45px; }

        .iphone-screen-frame {
            position: relative;
            width: 345px;
            height: 726px;
            background-color: #ffffff;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 6px rgba(255, 182, 193, 0.1);
        }

        .iphone6-top-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 0.5px solid #ffe4e6;
        }

        .sensor-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .camera-dot {
            width: 8px;
            height: 8px;
            background-color: #ffb3c6;
            border-radius: 50%;
        }

        .speaker-slot {
            width: 45px;
            height: 4px;
            background-color: #ffccd5;
            border-radius: 3px;
        }

        /* Status Bar */
        .status-bar {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: 24px;
            background-color: #ffffff;
            z-index: 119;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            font-weight: 500;
            color: #d87093;
            border-bottom: 0.5px solid #ffe4e6;
        }

        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
        }

        .status-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11.5px;
            font-weight: 600;
        }

        .battery-box {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* 🔄 พื้นที่เนื้อหาภายในที่ถูกปรับให้เลื่อน (Scroll) ได้ และเว้นที่ให้แถบเมนูด้านล่างไม่บังเนื้อหา */
        .screen-content-area {
            position: absolute;
            top: 84px;
            bottom: 55px;
            left: 0;
            width: 100%;
            background-color: #fff9fb;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* แต่ง Scrollbar ให้ดูน่ารักเข้ากับธีมร้านค้า */
        .screen-content-area::-webkit-scrollbar {
            width: 4px;
        }
        .screen-content-area::-webkit-scrollbar-thumb {
            background-color: #ffb3c6;
            border-radius: 4px;
        }

        /* ส่วนหัวหน้าร้าน */
        .store-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #ffffff;
            border-bottom: 1px solid #ffe4e6;
        }

        .store-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .store-avatar-box {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid #ff8fab;
            flex-shrink: 0;
        }

        .store-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .store-meta .store-title {
            font-size: 11.5px;
            font-weight: 600;
            color: #b55272;
            line-height: 1.2;
        }

        .store-meta .store-desc {
            font-size: 9px;
            color: #ff8fab;
        }

        .store-header-right i {
            color: #ff8fab;
            font-size: 13px;
            cursor: pointer;
        }

        /* ส่วนแบนเนอร์ร้านค้า */
        .banner-section {
            padding: 10px 14px 6px 14px;
            background: #ffffff;
            text-align: center;
        }

        .store-banner-container {
            width: 100%;
            aspect-ratio: 1122 / 495;
            background: #ffe5ec;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.2);
            cursor: pointer;
        }

        .store-banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #ffd1dc;
            border-radius: 50%;
        }

        .dot.active {
            width: 16px;
            border-radius: 4px;
            background-color: #ff8fab;
        }

        /* 📌 ปุ่มเช็คคิวเส้นปรุ */
        .queue-check-wrapper {
            padding: 8px 14px;
            background: #ffffff;
            margin-bottom: 6px;
        }

        .queue-check-btn {
            width: 100%;
            background: #fff0f3;
            border: 2px dashed #ff758c;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(255, 117, 140, 0.2);
            transition: all 0.2s ease;
        }

        .queue-check-btn:active {
            transform: scale(0.97);
            background: #ffe5ec;
        }

        .queue-btn-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .queue-icon-circle {
            width: 32px;
            height: 32px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff758c;
            font-size: 12px;
            box-shadow: 0 1px 3px rgba(255, 182, 193, 0.3);
        }

        .queue-text-box .queue-title {
            font-size: 11px;
            font-weight: 600;
            color: #b55272;
            line-height: 1.2;
        }

        .queue-text-box .queue-sub {
            font-size: 8.5px;
            color: #ff8fab;
        }

        .queue-check-btn i.fa-chevron-right {
            font-size: 10px;
            color: #ff8fab;
        }

        /* ส่วนบริการของเรา */
        .section-container {
            padding: 10px 14px;
            background: #fff9fb;
        }

        .section-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .section-title {
            font-size: 11.5px;
            font-weight: 600;
            color: #b55272;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .service-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .service-card {
            background: #ffffff;
            border: 1px solid #ffe4e6;
            border-radius: 14px;
            padding: 10px 6px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(255, 182, 193, 0.1);
            cursor: pointer;
        }

        .service-icon-circle {
            width: 36px;
            height: 36px;
            background: #ffe5ec;
            border-radius: 50%;
            margin: 0 auto 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff758c;
            font-size: 13px;
        }

        .service-name {
            font-size: 9.5px;
            font-weight: 600;
            color: #b55272;
        }

        /* ส่วนตัวอย่างผลงาน */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding-bottom: 25px;
        }

        .portfolio-card {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #ffe4e6;
            box-shadow: 0 2px 8px rgba(255, 182, 193, 0.1);
            cursor: pointer;
        }

        .portfolio-img {
            width: 100%;
            height: 110px;
            background: #ffe5ec;
        }

        .portfolio-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .portfolio-info {
            padding: 8px;
        }

        .portfolio-label-tag {
            display: inline-block;
            background: #ffe5ec;
            color: #b55272;
            font-size: 8.5px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 500;
            margin-bottom: 3px;
        }

        .portfolio-title {
            font-size: 10.5px;
            font-weight: 600;
            color: #b55272;
        }

        /* แถบเมนูด้านล่าง (ตรึงตำแหน่งไว้เหมือนเดิม) */
        .store-bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #ffffff;
            border-top: 1px solid #ffe4e6;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 118;
        }

        .nav-tab {
            background: none;
            border: none;
            cursor: pointer;
            color: #d1a1b0;
            font-size: 9px;
            text-align: center;
            flex: 1;
            font-family: 'Prompt', sans-serif;
        }

        .nav-tab i {
            font-size: 14px;
            display: block;
            margin-bottom: 2px;
        }

        .nav-tab.active {
            color: #ff758c;
            font-weight: 600;
        }

        /* Modal แจ้งเตือน */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 240px;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            border: 1px solid #ffe4e6;
        }

        .modal-content h3 {
            font-size: 13px;
            color: #b55272;
            margin-bottom: 6px;
        }

        .modal-content p {
            font-size: 10.5px;
            color: #d1a1b0;
            margin-bottom: 14px;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff8fab 0%, #ffb3c6 100%);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 10.5px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="iphone-device">
        <div class="side-button silent-switch"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <div class="iphone-screen-frame" id="iphoneScreen">
            
            <div class="iphone6-top-bezel">
                <div class="sensor-row">
                    <div class="camera-dot"></div>
                    <div class="speaker-slot"></div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-left">
                    <i class="fas fa-signal" style="font-size: 9px;"></i>
                    <span>mean☘︎</span>
                    <i class="fas fa-wifi" style="font-size: 9px; margin-left: 2px;"></i>
                </div>
                <div class="status-center">
                    <span id="clock">19:09</span>
                </div>
                <div class="status-right">
                    <div class="battery-box">
                        <span>45%</span>
                        <i class="fas fa-battery-three-quarters" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <!-- พื้นที่หน้าจอเนื้อหาที่สามารถเลื่อนขึ้น-ลงได้ -->
            <div class="screen-content-area">
                
                <!-- ส่วนหัวหน้าร้าน -->
                <div class="store-header">
                    <div class="store-header-left">
                        <div class="store-avatar-box">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Store Logo">
                        </div>
                        <div class="store-meta">
                            <div class="store-title">miori_shop 💖</div>
                            <div class="store-desc">บริการ & ออกแบบตัวละคร</div>
                        </div>
                    </div>
                    <div class="store-header-right">
                        <i class="fas fa-bell" onclick="openModal('การแจ้งเตือน', 'ไม่มีการแจ้งเตือนใหม่ในขณะนี้ค่า ✨')"></i>
                    </div>
                </div>

                <!-- แบนเนอร์ -->
                <div class="banner-section">
                    <div class="store-banner-container" onclick="openModal('ประกาศจากร้าน', 'ยินดีต้อนรับเข้าสู่ร้าน miori_shop ค่ะ สอบถามสินค้าทักแชทได้เลยน้า 💖')">
                        <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=1122&h=495&fit=crop" alt="Store Banner">
                    </div>
                    <div class="banner-dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>

                <!-- 📌 ปุ่มเช็คคิวเส้นปรุ -->
                <div class="queue-check-wrapper">
                    <div class="queue-check-btn" onclick="openModal('สถานะคิวงาน', '✨ คิวว่างปัจจุบัน: พร้อมรับงานจ้า\n📌 คิวที่กำลังทำ: 3 คิว (รอบส่งงานสัปดาห์นี้)')">
                        <div class="queue-btn-left">
                            <div class="queue-icon-circle">
                                <i class="fas fa-clipboard-list"></i>
                            </div>
                            <div class="queue-text-box">
                                <div class="queue-title">เช็คคิว / สถานะงาน 📋</div>
                                <div class="queue-sub">คลิกเพื่อดูสถานะคิวปัจจุบันค่า</div>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>

                <!-- ส่วนบริการของเรา -->
                <div class="section-container">
                    <div class="section-header-flex">
                        <div class="section-title">
                            <i class="fas fa-heart" style="color: #ff758c;"></i> บริการของเรา
                        </div>
                    </div>

                    <div class="service-grid-3">
                        <div class="service-card" onclick="openModal('รับทำป้าย', 'รับออกแบบและทำป้ายร้านค้าน่ารักๆ สไตล์มินิมอล สนใจทักแชทได้เลยค่า')">
                            <div class="service-icon-circle">
                                <i class="fas fa-paint-brush"></i>
                            </div>
                            <div class="service-name">รับทำป้าย</div>
                        </div>

                        <div class="service-card" onclick="openModal('รับทำลายน้ำ', 'รับทำลายน้ำสำหรับใส่รูปภาพสินค้า ลายเส้นน่ารัก ป้องกันการก๊อปปี้')">
                            <div class="service-icon-circle">
                                <i class="fas fa-tint"></i>
                            </div>
                            <div class="service-name">รับทำลายน้ำ</div>
                        </div>

                        <div class="service-card" onclick="openModal('ออกแบบกราฟิก', 'รับออกแบบกราฟิกทั่วไป โลโก้ แบนเนอร์ และสื่อโปรโมทต่างๆ')">
                            <div class="service-icon-circle">
                                <i class="fas fa-pen-nib"></i>
                            </div>
                            <div class="service-name">ออกแบบกราฟิก</div>
                        </div>
                    </div>
                </div>

                <!-- ส่วนตัวอย่างผลงาน -->
                <div class="section-container">
                    <div class="section-header-flex">
                        <div class="section-title">
                            <i class="fas fa-store" style="color: #ff758c;"></i> ตัวอย่างผลงาน
                        </div>
                    </div>

                    <div class="portfolio-grid">
                        <div class="portfolio-card" onclick="openModal('Cute Sign 1', 'ตัวอย่างงานออกแบบป้ายร้านค้าน่ารักๆ โทนพาสเทล')">
                            <div class="portfolio-img">
                                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&h=300&fit=crop" alt="Work 1">
                            </div>
                            <div class="portfolio-info">
                                <span class="portfolio-label-tag">💖 น่ารักมาก</span>
                                <div class="portfolio-title">Cute Sign 1</div>
                            </div>
                        </div>

                        <div class="portfolio-card" onclick="openModal('Thank You Card', 'ตัวอย่างการ์ดขอบคุณลูกค้า ดีไซน์พรีเมียม')">
                            <div class="portfolio-img">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop" alt="Work 2">
                            </div>
                            <div class="portfolio-info">
                                <span class="portfolio-label-tag">✨ Thank You</span>
                                <div class="portfolio-title">Thank You</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- แถบเมนูด้านล่าง -->
            <div class="store-bottom-nav">
                <button class="nav-tab active" onclick="switchTab(this)">
                    <i class="fas fa-home"></i>
                    <span>หน้าแรก</span>
                </button>
                <button class="nav-tab" onclick="switchTab(this); openModal('หมวดหมู่สินค้า', 'เลือกดูสินค้าทั้งหมดของทางร้านได้ที่นี่ค่ะ')">
                    <i class="fas fa-th-large"></i>
                    <span>สินค้า</span>
                </button>
                <button class="nav-tab" onclick="switchTab(this); openModal('ติดต่อเรา', 'ช่องทางติดต่อ: LINE หรือ Instagram miori_shop ค้าบ 💖')">
                    <i class="fas fa-comment-dots"></i>
                    <span>ติดต่อ</span>
                </button>
            </div>

        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal" id="storeModal">
        <div class="modal-content">
            <h3 id="modalTitle">หัวข้อ</h3>
            <p id="modalDesc" style="white-space: pre-line;">รายละเอียด...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function openModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('storeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('storeModal').style.display = 'none';
        }

        function switchTab(element) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }
    </script>

</body>
</html>
