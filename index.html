<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram DM Mockup - Correct Flow</title>
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ตัวเครื่อง iPhone 11 สมจริง --- */
        .iphone-device {
            position: relative;
            width: 410px;
            height: 840px;
            background: linear-gradient(135deg, #e4e4e4 0%, #a8a8a8 100%);
            border-radius: 52px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.15),
                inset 0 0 0 2px rgba(255, 255, 255, 0.9),
                inset 0 0 0 6px #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มด้านข้าง iPhone 11 */
        .side-button {
            position: absolute;
            background: #cbd5e1;
            border-radius: 4px;
        }
        .volume-up { left: -9px; top: 165px; width: 4px; height: 34px; }
        .volume-down { left: -9px; top: 215px; width: 4px; height: 34px; }
        .power-button { right: -9px; top: 190px; width: 4px; height: 70px; }

        /* กรอบหน้าจอสีดำด้านใน (Bezel) */
        .iphone-screen-frame {
            position: relative;
            width: 386px;
            height: 816px;
            background-color: #000000;
            border-radius: 42px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.2);
        }

        /* หน้าจอแสดงผลด้านในสุด (สีขาวสไตล์ IG) */
        .screen-content-area {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Notch (รอยบาก) ด้านบน */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background-color: #000000;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .speaker {
            width: 45px;
            height: 4px;
            background-color: #333333;
            border-radius: 3px;
            position: absolute;
            top: 7px;
        }

        .camera {
            width: 10px;
            height: 10px;
            background-color: #111111;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            right: 32px;
            border: 1px solid #222;
        }

        /* --- หน้าจอแชทสไตล์ Instagram DM --- */
        .chat-screen {
            background-color: #ffffff;
            flex: 1;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-screen::-webkit-scrollbar {
            display: none;
        }

        /* Header แชท Instagram */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 0.5px solid #dbdbdb;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon {
            color: #262626;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-avatar-header {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            background: #efefef;
            flex-shrink: 0;
        }
        .chat-avatar-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 12.5px;
            font-weight: 600;
            color: #262626;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }
        .chat-user-meta .status {
            font-size: 10px;
            color: #8e8e8e;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .chat-header-right i {
            color: #262626;
            font-size: 18px;
            cursor: pointer;
        }

        /* กล่องข้อความในแชท */
        .chat-body {
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* จัดกลุ่มข้อความฝั่งซ้าย (มีรูปโปรไฟล์วงกลมด้านข้างสไตล์ IG) */
        .message-row-received {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            align-self: flex-start;
            max-width: 85%;
            animation: fadeIn 0.35s ease;
        }

        .chat-avatar-msg {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .chat-avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .received-content-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ฟองข้อความฝั่งซ้าย (ผู้ขาย - สีเทาอ่อน IG) */
        .message.received {
            background: #efefef;
            color: #262626;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            width: fit-content;
            width: -webkit-fit-content;
            word-wrap: break-word;
        }

        /* ฟองข้อความฝั่งขวา (ตัวเราเอง - ไล่สี Gradient แบบ IG) */
        .message.sent {
            background: linear-gradient(135deg, #0095f6 0%, #ad00ff 100%);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            align-self: flex-end;
            width: fit-content;
            width: -webkit-fit-content;
            font-weight: 400;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
        }

        /* กล่องรูปภาพโปรโมชันในแชท (ซ่อนไว้ก่อนจนกว่าจะกดส่ง) */
        #interactiveContent {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .image-message-box {
            background: #efefef;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 6px;
            width: 210px;
            overflow: hidden;
        }

        .image-container {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .image-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        /* ฟองธนาคารฝั่งซ้าย */
        .bank-message-box {
            background: #efefef;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 10px 14px;
            width: fit-content;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 12px;
        }

        .bank-info .title {
            font-weight: 500;
            color: #8e8e8e;
            font-size: 11.5px;
            margin-bottom: 2px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #262626;
            letter-spacing: 0.5px;
        }

        /* ปุ่มคัดลอกสไตล์ IG */
        .copy-btn {
            background: #dbdbdb;
            border: none;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            color: #262626;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }
        .copy-btn:active {
            background: #0095f6;
            color: #fff;
            transform: scale(0.95);
        }

        /* แถบช่องพิมพ์ข้อความด้านล่างสไตล์ Instagram DM */
        .chat-footer {
            padding: 8px 12px 12px 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 22px;
            padding: 6px 12px;
            gap: 10px;
        }

        .camera-circle-btn {
            width: 28px;
            height: 28px;
            background: #0095f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            font-size: 13px;
            color: #262626;
            outline: none;
            border: none;
            background: transparent;
            font-family: 'Prompt', sans-serif;
        }

        /* ปุ่มส่งข้อความแบบ IG (ลูกศรพุ่งขวา หรือคำว่า ส่ง) */
        .send-btn {
            background: transparent;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            padding: 2px 6px;
            transition: opacity 0.2s;
        }
        .send-btn:active {
            opacity: 0.6;
        }

        .footer-right-icons {
            display: flex;
            gap: 12px;
            color: #262626;
            font-size: 18px;
            align-items: center;
        }

        /* Home Indicator (ขีดด้านล่างจอ iPhone) */
        .home-indicator {
            width: 120px;
            height: 4px;
            background-color: #000000;
            border-radius: 100px;
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <!-- บอดี้ตัวเครื่อง iPhone 11 -->
    <div class="iphone-device">
        <!-- ปุ่มข้างเครื่อง -->
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอสีดำ (Bezel) -->
        <div class="iphone-screen-frame">
            <!-- พื้นที่หน้าจอแสดงผล -->
            <div class="screen-content-area">
                <!-- Notch (รอยบาก) ด้านบน -->
                <div class="notch">
                    <div class="speaker"></div>
                    <div class="camera"></div>
                </div>

                <!-- หน้าจอแชทภายใน -->
                <div class="chat-screen">
                    <!-- Header แชท Instagram DM -->
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <i class="fas fa-chevron-left back-icon"></i>
                            <div class="chat-avatar-header">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="chat-user-meta">
                                <div class="name">wongsuda_shop</div>
                                <div class="status">Active 5m ago</div>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <i class="fas fa-phone"></i>
                            <i class="fas fa-video"></i>
                            <i class="fas fa-circle-info"></i>
                        </div>
                    </div>

                    <!-- ข้อความแชท -->
                    <div class="chat-body" id="chatBody">
                        <!-- ข้อความต้อนรับเริ่มต้นจากร้านค้า -->
                        <div class="message-row-received">
                            <div class="chat-avatar-msg">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="received-content-group">
                                <div class="message received">
                                    สวัสดีค่ะคุณลูกค้า สนใจบริการตัวแทนดันกลุ่มสอบถามรายละเอียดได้เลยนะคะ น้า 🌷✨
                                </div>
                            </div>
                        </div>

                        <!-- ส่วนที่จะแสดงผลหลังจากกดปุ่มส่งข้อความ -->
                        <div id="interactiveContent">
                            <!-- ข้อความที่เราส่งออกไปฝั่งขวา -->
                            <div class="message sent" id="sentMessageBubble">
                                ขอช่องทางการโอนหน่อยค้าบ
                            </div>

                            <!-- รูปภาพโปรโมชันที่โผล่มาหลังจากกดส่ง -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="image-message-box">
                                    <div class="image-container">
                                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&fit=crop" alt="Shared Image">
                                    </div>
                                </div>
                            </div>

                            <!-- ข้อความร้านค้าตอบกลับพร้อมเลขบัญชี -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยน้า 👇
                                    </div>

                                    <!-- บัญชีธนาคารกสิกรไทย -->
                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-university" style="color:#2563eb;"></i> กสิกรไทย (KBANK)</div>
                                            <div class="num" id="kbankNum">123-4-56789-0</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                    </div>

                                    <!-- TrueMoney Wallet -->
                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-wallet" style="color:#f97316;"></i> TrueMoney Wallet</div>
                                            <div class="num" id="walletNum">081-234-5678</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- แถบช่องพิมพ์ข้อความด้านล่างสไตล์ Instagram DM -->
                    <div class="chat-footer">
                        <div class="chat-input-wrapper">
                            <div class="camera-circle-btn">
                                <i class="fas fa-camera"></i>
                            </div>
                            <!-- ช่องพิมพ์ที่มีข้อความค้างไว้ตามที่คุณต้องการ -->
                            <input type="text" id="chatInput" class="chat-input-field" value="ขอช่องทางการโอนหน่อยค้าบ">
                            
                            <!-- ปุ่มส่งแบบไอจี (คลิกเพื่อส่งและแสดงรูป) -->
                            <button class="send-btn" onclick="sendMessage()">ส่ง</button>
                        </div>
                    </div>
                </div>

                <!-- Home Indicator ขีดด้านล่างจอไอโฟน -->
                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมการกดปุ่มส่งและคัดลอก -->
    <script>
        function sendMessage() {
            const inputField = document.getElementById('chatInput');
            const textValue = inputField.value.trim();
            
            if(textValue === "") return;

            // อัปเดตข้อความในฟองฝั่งขวาตามที่อยู่ในช่องพิมพ์
            document.getElementById('sentMessageBubble').innerText = textValue;

            // แสดงส่วนรูปภาพและเลขบัญชี
            const interactiveContent = document.getElementById('interactiveContent');
            interactiveContent.style.display = 'flex';
            
            // ล้างข้อความในช่องพิมพ์
            inputField.value = '';
            
            // เลื่อนหน้าจอแชทลงมาด้านล่างสุดอัตโนมัติ
            const chatBody = document.getElementById('chatBody');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                btn.style.background = '#0095f6';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#dbdbdb';
                    btn.style.color = '#262626';
                }, 1500);
            });
        }
    </script>

</body>
</html>
