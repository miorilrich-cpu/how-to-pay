<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Cat Ear iPhone Case - IG DM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* --- ตัวเครื่อง iPhone ใส่เคสหูแมวและอุ้งเท้า --- */
        .iphone-case-container {
            position: relative;
            margin-left: 30px; /* เว้นพื้นที่ให้พวงกุญแจอุ้งเท้าด้านข้าง */
        }

        .iphone-device {
            position: relative;
            width: 375px;
            height: 740px;
            background: #ffffff; /* เคสซิลิโคนสีขาวละมุน */
            border-radius: 46px;
            box-shadow: 
                0 25px 50px rgba(255, 182, 193, 0.45),
                inset 0 0 0 2px #ffe4e1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* หูแมว 2 ข้างด้านบนเคส */
        .cat-ear {
            position: absolute;
            top: -22px;
            width: 55px;
            height: 40px;
            background: #ffffff;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 10px rgba(255, 182, 193, 0.3);
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .cat-ear::after {
            content: '';
            width: 30px;
            height: 22px;
            background: #ffb6c1; /* ด้านในหูสีชมพู */
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            margin-top: 6px;
        }
        .cat-ear.left { left: 45px; transform: rotate(-8deg); }
        .cat-ear.right { right: 45px; transform: rotate(8deg); }

        /* อุ้งเท้าแมวที่มุมล่างซ้าย-ขวาของเคส */
        .cat-paw-corner {
            position: absolute;
            bottom: 12px;
            font-size: 18px;
            z-index: 130;
            filter: drop-shadow(0 2px 3px rgba(255, 182, 193, 0.5));
        }
        .paw-bottom-left { left: 16px; transform: rotate(-25deg); }
        .paw-bottom-right { right: 16px; transform: rotate(25deg); }

        /* สายห้อยจี้อุ้งเท้าห้อยอยู่ด้านซ้าย */
        .charm-strap {
            position: absolute;
            left: -48px;
            bottom: 110px;
            display: flex;
            align-items: center;
            z-index: 150;
        }
        .chain-dots {
            width: 38px;
            height: 8px;
            background: radial-gradient(circle, #ffb6c1 45%, transparent 50%);
            background-size: 8px 8px;
        }
        .paw-pendant {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #ffc0cb 0%, #ff69b4 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.4);
            border: 2px solid #ffffff;
            position: relative;
        }
        /* ดีไซน์ปุ่มอุ้งเท้าแมว 3 มิติ */
        .paw-pad-main {
            width: 20px;
            height: 17px;
            background: #ffffff;
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            bottom: 8px;
        }
        .paw-toe-1, .paw-toe-2, .paw-toe-3 {
            position: absolute;
            width: 7px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            top: 7px;
        }
        .paw-toe-1 { left: 9px; }
        .paw-toe-2 { left: 18.5px; top: 5px; }
        .paw-toe-3 { right: 9px; }

        /* ปุ่มด้านข้าง */
        .side-button {
            position: absolute;
            background: #ffb6c1;
            border-radius: 2px;
        }
        .volume-up { left: -4px; top: 130px; width: 3px; height: 32px; }
        .volume-down { left: -4px; top: 175px; width: 3px; height: 32px; }
        .power-button { right: -4px; top: 135px; width: 3px; height: 45px; }

        /* กรอบหน้าจอภายใน */
        .iphone-screen-frame {
            position: relative;
            width: 345px;
            height: 712px;
            background-color: #ffffff;
            border-radius: 38px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.06);
        }

        /* ขอบบนเครื่อง (ลำโพงและกล้อง) */
        .iphone6-top-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 56px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 6px;
            border-bottom: 0.5px solid #fce4e4;
        }

        .sensor-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .camera-hole {
            width: 9px;
            height: 9px;
            background-color: #3b3b3b;
            border-radius: 50%;
        }

        .speaker-slot {
            width: 48px;
            height: 4px;
            background-color: #d1d1d1;
            border-radius: 3px;
        }

        .status-bar-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 18px;
            font-size: 11px;
            color: #666666;
            font-weight: 500;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .screen-content-area {
            position: relative;
            width: 100%;
            flex: 1;
            margin-top: 56px;
            margin-bottom: 54px;
            background-color: #fff9fb;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- หน้าจอแชท (ข้อมูลเดิมของคุณครบถ้วน ไม่ถูกเปลี่ยน) --- */
        .chat-screen {
            background-color: #fff9fb;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-screen::-webkit-scrollbar {
            display: none;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #ffe4e1;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon {
            color: #ff69b4;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-avatar-header {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            overflow: hidden;
            background: #ffe4e1;
            flex-shrink: 0;
            border: 1px solid #ffb6c1;
        }
        .chat-avatar-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 13px;
            font-weight: 600;
            color: #db7093;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .chat-user-meta .status {
            font-size: 10px;
            color: #d8bfd8;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-header-right i {
            color: #ff69b4;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-body {
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .message-row-received {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            align-self: flex-start;
            max-width: 85%;
            animation: fadeIn 0.35s ease;
        }

        .chat-avatar-msg {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
            border: 1px solid #ffb6c1;
        }
        .chat-avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .received-content-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: #ffe4e1;
            color: #555555;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            width: fit-content;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.15);
        }

        .message.sent {
            background: linear-gradient(135deg, #ff8da1 0%, #d8b4fe 100%);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            align-self: flex-end;
            width: fit-content;
            font-weight: 400;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(255, 141, 161, 0.3);
        }

        #interactiveContent {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .image-message-box {
            background: #ffe4e1;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 6px;
            width: 200px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.15);
        }

        .image-container {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .image-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        .bank-message-box {
            background: #ffe4e1;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 10px 14px;
            width: fit-content;
            display: flex;
            gap: 14px;
            align-items: center;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.15);
        }

        .bank-info .title {
            font-weight: 500;
            color: #b76e79;
            font-size: 11px;
            margin-bottom: 2px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: #ffb6c1;
            border: none;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 2px 4px rgba(255, 182, 193, 0.4);
        }
        .copy-btn:active {
            background: #ff69b4;
            transform: scale(0.95);
        }

        .chat-footer {
            padding: 8px 12px 14px 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #ffe4e1;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #fff0f5;
            border: 1px solid #ffb6c1;
            border-radius: 20px;
            padding: 5px 12px;
            gap: 8px;
        }

        .camera-circle-btn {
            width: 26px;
            height: 26px;
            background: #ffb6c1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 11px;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            font-size: 13px;
            color: #555555;
            outline: none;
            border: none;
            background: transparent;
            font-family: 'Prompt', sans-serif;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #ff69b4;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            padding: 2px 4px;
        }

        /* ขอบล่างพร้อมปุ่มโฮมกลมๆ และลายอุ้งเท้า */
        .iphone6-bottom-bezel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 54px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 0.5px solid #fce4e4;
        }

        .home-button-ring {
            width: 38px;
            height: 38px;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
            transition: background 0.1s;
        }
        .home-button-ring:active {
            background: #fff0f5;
        }

        .home-inner-square {
            width: 12px;
            height: 12px;
            border: 1.5px solid #ffb6c1;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="iphone-case-container">
        <!-- หูแมวด้านบนเคส -->
        <div class="cat-ear left"></div>
        <div class="cat-ear right"></div>

        <!-- สายห้อยจี้อุ้งเท้าด้านข้าง -->
        <div class="charm-strap">
            <div class="chain-dots"></div>
            <div class="paw-pendant">
                <div class="paw-toe-1"></div>
                <div class="paw-toe-2"></div>
                <div class="paw-toe-3"></div>
                <div class="paw-pad-main"></div>
            </div>
        </div>

        <div class="iphone-device">
            <!-- ปุ่มข้างเครื่อง -->
            <div class="side-button volume-up"></div>
            <div class="side-button volume-down"></div>
            <div class="side-button power-button"></div>

            <!-- อุ้งเท้าที่มุมล่างเคส -->
            <div class="cat-paw-corner paw-bottom-left">🐾</div>
            <div class="cat-paw-corner paw-bottom-right">🐾</div>

            <!-- หน้าจอภายในกรอบ -->
            <div class="iphone-screen-frame">
                
                <!-- ขอบบน -->
                <div class="iphone6-top-bezel">
                    <div class="sensor-container">
                        <div class="camera-hole"></div>
                        <div class="speaker-slot"></div>
                    </div>
                    <div class="status-bar-top">
                        <span>14:49</span>
                        <div class="status-right">
                            <i class="fas fa-signal" style="font-size: 10px;"></i>
                            <i class="fas fa-wifi" style="font-size: 10px;"></i>
                            <span>46% <i class="fas fa-battery-three-quarters"></i></span>
                        </div>
                    </div>
                </div>

                <!-- พื้นที่เนื้อหา -->
                <div class="screen-content-area">
                    <div class="chat-screen">
                        <div class="chat-header">
                            <div class="chat-header-left">
                                <i class="fas fa-chevron-left back-icon"></i>
                                <div class="chat-avatar-header">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="chat-user-meta">
                                    <div class="name">wongsuda_shop ✨</div>
                                    <div class="status">Active 5m ago</div>
                                </div>
                            </div>
                            <div class="chat-header-right">
                                <i class="fas fa-phone"></i>
                                <i class="fas fa-video"></i>
                                <i class="fas fa-circle-info"></i>
                            </div>
                        </div>

                        <div class="chat-body" id="chatBody">
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        สวัสดีค่ะคุณลูกค้า สนใจบริการตัวแทนดันกลุ่ม สอบถามรายละเอียดได้เลยน้า 💖🌷
                                    </div>
                                </div>
                            </div>

                            <div id="interactiveContent">
                                <div class="message sent" id="sentMessageBubble">
                                    ขอช่องทางการโอนหน่อยค้าบ
                                </div>

                                <div class="message-row-received">
                                    <div class="chat-avatar-msg">
                                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                    </div>
                                    <div class="image-message-box">
                                        <div class="image-container">
                                            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&fit=crop" alt="Shared Image">
                                        </div>
                                    </div>
                                </div>

                                <div class="message-row-received">
                                    <div class="chat-avatar-msg">
                                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                    </div>
                                    <div class="received-content-group">
                                        <div class="message received">
                                            ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยนะค้าบ 👇
                                        </div>

                                        <div class="bank-message-box">
                                            <div class="bank-info">
                                                <div class="title"><i class="fas fa-university" style="color:#2563eb;"></i> กสิกรไทย (KBANK)</div>
                                                <div class="num">123-4-56789-0</div>
                                            </div>
                                            <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                        </div>

                                        <div class="bank-message-box">
                                            <div class="bank-info">
                                                <div class="title"><i class="fas fa-wallet" style="color:#f97316;"></i> TrueMoney Wallet</div>
                                                <div class="num">081-234-5678</div>
                                            </div>
                                            <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="chat-footer">
                            <div class="chat-input-wrapper">
                                <div class="camera-circle-btn">
                                    <i class="fas fa-camera"></i>
                                </div>
                                <input type="text" id="chatInput" class="chat-input-field" value="ขอช่องทางการโอนหน่อยค้าบ">
                                <button class="send-btn" onclick="sendMessage()">ส่ง</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ขอบล่างพร้อมปุ่มโฮม -->
                <div class="iphone6-bottom-bezel">
                    <div class="home-button-ring" onclick="sendMessage()">
                        <div class="home-inner-square"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('chatInput');
            const textValue = inputField.value.trim();
            if(textValue === "") return;

            document.getElementById('sentMessageBubble').innerText = textValue;
            document.getElementById('interactiveContent').style.display = 'flex';
            inputField.value = '';
            
            const chatBody = document.getElementById('chatBody');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                btn.style.background = '#ff69b4';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#ffb6c1';
                }, 1500);
            });
        }
    </script>

</body>
</html>
