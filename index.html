<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic iPhone 6 - IG DM (Correct Order)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        /* โครงตัวเครื่อง iPhone 6 คลาสสิก */
        .iphone-device {
            position: relative;
            width: 375px;
            height: 750px;
            background: linear-gradient(135deg, #f5f5f7 0%, #d1d5db 100%);
            border-radius: 48px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                inset 0 0 0 2px #ffffff,
                inset 0 0 0 4px #c0c4cc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มด้านข้างตัวเครื่อง */
        .side-button {
            position: absolute;
            background: #c0c4cc;
            border-radius: 2px;
        }
        .silent-switch { left: -4px; top: 90px; width: 3px; height: 18px; }
        .volume-up { left: -4px; top: 130px; width: 3px; height: 32px; }
        .volume-down { left: -4px; top: 175px; width: 3px; height: 32px; }
        .power-button { right: -4px; top: 135px; width: 3px; height: 45px; }

        /* กรอบหน้าจอสีขาวด้านในแบบ iPhone 6 */
        .iphone-screen-frame {
            position: relative;
            width: 345px;
            height: 726px;
            background-color: #ffffff;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.06);
        }

        /* ขอบบน iPhone 6 (กล้อง + ลำโพงรี) */
        .iphone6-top-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 0.5px solid #f0f0f0;
        }

        .sensor-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .camera-dot {
            width: 9px;
            height: 9px;
            background-color: #3b3b3b;
            border-radius: 50%;
        }

        .speaker-slot {
            width: 50px;
            height: 4px;
            background-color: #d1d1d1;
            border-radius: 3px;
        }

        /* พื้นที่แสดงผลแชท */
        .screen-content-area {
            position: relative;
            width: 100%;
            flex: 1;
            margin-top: 75px;
            margin-bottom: 75px;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* หน้าจอแชทภายใน */
        .chat-screen {
            background-color: #ffffff;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #ffffff;
            z-index: 10;
            border-bottom: 1px solid #dbdbdb;
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon {
            color: #262626;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-avatar-header {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            background: #efefef;
            flex-shrink: 0;
        }
        .chat-avatar-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 12px;
            font-weight: 600;
            color: #262626;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .chat-user-meta .status {
            font-size: 9px;
            color: #8e8e8e;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-right i {
            color: #262626;
            font-size: 14px;
            cursor: pointer;
        }

        /* จัดเรียงข้อความเริ่มต้นจากด้านบนลงล่างตามธรรมชาติแชทจริง */
        .chat-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            justify-content: flex-start; 
            overflow: hidden;
        }

        .message-row-received {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            align-self: flex-start;
            max-width: 85%;
            animation: fadeIn 0.35s ease;
        }

        .chat-avatar-msg {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .chat-avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .received-content-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: #efefef;
            color: #262626;
            padding: 8px 12px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 12px;
            line-height: 1.35;
            width: fit-content;
            word-wrap: break-word;
        }

        .message.sent {
            background: #0095f6;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            font-size: 12px;
            line-height: 1.35;
            align-self: flex-end;
            width: fit-content;
            font-weight: 400;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
        }

        #interactiveContent {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .image-message-box {
            background: #efefef;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 5px;
            width: 170px;
            overflow: hidden;
        }

        .image-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .image-container img {
            width: 100%;
            height: auto;
            max-height: 90px;
            object-fit: cover;
            display: block;
        }

        .bank-message-box {
            background: #efefef;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 8px 12px;
            width: fit-content;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 11px;
        }

        .bank-info .title {
            font-weight: 500;
            color: #262626;
            font-size: 10px;
            margin-bottom: 1px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 12px;
            font-weight: 600;
            color: #262626;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: #dbdbdb;
            border: none;
            padding: 5px 8px;
            border-radius: 10px;
            font-size: 10px;
            color: #262626;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }
        .copy-btn:active {
            background: #0095f6;
            color: #fff;
        }

        .chat-footer {
            padding: 8px 12px 10px 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #dbdbdb;
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #efefef;
            border-radius: 18px;
            padding: 4px 10px;
            gap: 6px;
        }

        .camera-circle-btn {
            width: 24px;
            height: 24px;
            background: #dbdbdb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #262626;
            font-size: 10px;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            font-size: 12px;
            color: #262626;
            outline: none;
            border: none;
            background: transparent;
            font-family: 'Prompt', sans-serif;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #0095f6;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            padding: 2px 4px;
        }

        /* ขอบล่าง iPhone 6 พร้อมปุ่มโฮมเกลี้ยงๆ */
        .iphone6-bottom-bezel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 0.5px solid #f0f0f0;
        }

        .home-button-ring {
            width: 44px;
            height: 44px;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
            transition: background 0.1s;
        }
        .home-button-ring:active {
            background: #f3f4f6;
        }
    </style>
</head>
<body>

    <div class="iphone-device">
        <!-- ปุ่มข้างตัวเครื่อง -->
        <div class="side-button silent-switch"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอโทรศัพท์ -->
        <div class="iphone-screen-frame">
            
            <!-- ขอบบน iPhone 6 -->
            <div class="iphone6-top-bezel">
                <div class="sensor-row">
                    <div class="camera-dot"></div>
                    <div class="speaker-slot"></div>
                </div>
            </div>

            <!-- พื้นที่เนื้อหาแชท -->
            <div class="screen-content-area">
                <div class="chat-screen">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <i class="fas fa-chevron-left back-icon"></i>
                            <div class="chat-avatar-header">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="chat-user-meta">
                                <div class="name">wongsuda_shop ✨</div>
                                <div class="status">Active 5m ago</div>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <i class="fas fa-phone"></i>
                            <i class="fas fa-video"></i>
                            <i class="fas fa-circle-info"></i>
                        </div>
                    </div>

                    <div class="chat-body" id="chatBody">
                        <!-- ข้อความทักทายจากร้านค้า (อยู่บนสุด) -->
                        <div class="message-row-received">
                            <div class="chat-avatar-msg">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="received-content-group">
                                <div class="message received">
                                    สวัสดีค่ะคุณลูกค้า สนใจบริการตัวแทนดันกลุ่ม สอบถามรายละเอียดได้เลยน้า 💖🌷
                                </div>
                            </div>
                        </div>

                        <div id="interactiveContent">
                            <div class="message sent" id="sentMessageBubble">
                                ขอช่องทางการโอนหน่อยค้าบ
                            </div>

                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="image-message-box">
                                    <div class="image-container">
                                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&fit=crop" alt="Shared Image">
                                    </div>
                                </div>
                            </div>

                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยนะค้าบ 👇
                                    </div>

                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-university" style="color:#2563eb;"></i> กสิกรไทย (KBANK)</div>
                                            <div class="num">123-4-56789-0</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                    </div>

                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-wallet" style="color:#f97316;"></i> TrueMoney Wallet</div>
                                            <div class="num">081-234-5678</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="chat-footer">
                        <div class="chat-input-wrapper">
                            <div class="camera-circle-btn">
                                <i class="fas fa-camera"></i>
                            </div>
                            <input type="text" id="chatInput" class="chat-input-field" value="ขอช่องทางการโอนหน่อยค้าบ">
                            <button class="send-btn" onclick="sendMessage()">ส่ง</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ขอบล่าง iPhone 6 พร้อมปุ่มโฮมเกลี้ยงๆ -->
            <div class="iphone6-bottom-bezel">
                <div class="home-button-ring" onclick="sendMessage()"></div>
            </div>

        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('chatInput');
            const textValue = inputField.value.trim();
            if(textValue === "") return;

            document.getElementById('sentMessageBubble').innerText = textValue;
            document.getElementById('interactiveContent').style.display = 'flex';
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 1500);
            });
        }
    </script>

</body>
</html>
