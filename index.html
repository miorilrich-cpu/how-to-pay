<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic iPhone 6 - IG DM (Perfect Fit)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow: hidden;
        }

        /* โครงตัวเครื่อง iPhone 6 คลาสสิก - เพิ่มแอนิเมชันจอส่ายไปมาเบาๆ */
        .iphone-device {
            position: relative;
            width: 375px;
            height: 750px;
            background: linear-gradient(135deg, #fff0f5 0%, #ffc0cb 100%);
            border-radius: 48px;
            box-shadow: 
                0 25px 50px rgba(255, 182, 193, 0.4),
                inset 0 0 0 2px #ffffff,
                inset 0 0 0 4px #ffb6c1;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: gentleSway 4s ease-in-out infinite;
        }

        @keyframes gentleSway {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-1.5deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(1.5deg); }
            100% { transform: rotate(0deg); }
        }

        /* ปุ่มด้านข้างตัวเครื่อง */
        .side-button {
            position: absolute;
            background: #ffb6c1;
            border-radius: 2px;
        }
        .silent-switch { left: -4px; top: 90px; width: 3px; height: 18px; }
        .volume-up { left: -4px; top: 130px; width: 3px; height: 32px; }
        .volume-down { left: -4px; top: 175px; width: 3px; height: 32px; }
        .power-button { right: -4px; top: 135px; width: 3px; height: 45px; }

        /* กรอบหน้าจอสีขาวด้านในแบบ iPhone 6 */
        .iphone-screen-frame {
            position: relative;
            width: 345px;
            height: 726px;
            background-color: #fff9fb;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 6px rgba(255,182,193,0.2);
        }

        /* ขอบบน iPhone 6 (กล้อง + ลำโพง อยู่บนสุด) */
        .iphone6-top-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #fff9fb;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 0.5px solid #ffe4e1;
        }

        .sensor-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .camera-dot {
            width: 9px;
            height: 9px;
            background-color: #3b3b3b;
            border-radius: 50%;
        }

        .speaker-slot {
            width: 50px;
            height: 4px;
            background-color: #ffb6c1;
            border-radius: 3px;
        }

        /* แถบสถานะด้านบน */
        .status-bar {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: 24px;
            background-color: #fff9fb;
            z-index: 119;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            font-weight: 500;
            color: #d87093;
            border-bottom: 0.5px solid #ffe4e1;
        }

        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .battery-box {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* พื้นที่แสดงผลแชท */
        .screen-content-area {
            position: relative;
            width: 100%;
            flex: 1;
            margin-top: 84px; 
            margin-bottom: 75px;
            background-color: #fff9fb;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-screen {
            background-color: transparent;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #ffffff;
            z-index: 10;
            border-bottom: 1px solid #ffe4e1;
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon {
            color: #d87093;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-avatar-header {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            background: #ffe4e1;
            flex-shrink: 0;
            border: 1px solid #ffb6c1;
        }
        .chat-avatar-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 12px;
            font-weight: 600;
            color: #d87093;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .chat-user-meta .status {
            font-size: 9px;
            color: #e9967a;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-right i {
            color: #d87093;
            font-size: 14px;
            cursor: pointer;
        }

        /* ส่วนเนื้อหาแชท */
        .chat-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* เพิ่มเอฟเฟกต์ดาวโปรยปรายด้านในหน้าจอแชท */
        .chat-body::before {
            content: "⭐";
            position: absolute;
            top: -20px;
            left: 20%;
            font-size: 12px;
            animation: fallStar 5s linear infinite;
            opacity: 0.7;
            z-index: 1;
        }
        .chat-body::after {
            content: "✨";
            position: absolute;
            top: -20px;
            left: 70%;
            font-size: 10px;
            animation: fallStar 7s linear infinite 2s;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes fallStar {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(450px) rotate(360deg); opacity: 0; }
        }

        .chat-flow-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .message-row-received {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            align-self: flex-start;
            max-width: 85%;
        }

        .chat-avatar-msg {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
            border: 1px solid #ffb6c1;
        }
        .chat-avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .received-content-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.received {
            background: #ffe4e1;
            color: #b03060;
            padding: 7px 11px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 11.5px;
            line-height: 1.35;
            width: fit-content;
            word-wrap: break-word;
        }

        .message.sent {
            background: #ff69b4;
            color: #ffffff;
            padding: 7px 11px;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            font-size: 11.5px;
            line-height: 1.35;
            align-self: flex-end;
            width: fit-content;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(255, 105, 180, 0.3);
        }

        .image-message-box {
            background: #ffe4e1;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 4px;
            width: 145px;
            overflow: hidden;
        }

        .image-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .image-container img {
            width: 100%;
            height: auto;
            max-height: 75px;
            object-fit: cover;
            display: block;
        }

        .bank-message-box {
            background: #ffe4e1;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 7px 10px;
            width: fit-content;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 10.5px;
        }

        .bank-info .title {
            font-weight: 500;
            color: #b03060;
            font-size: 9.5px;
            margin-bottom: 1px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 11.5px;
            font-weight: 600;
            color: #b03060;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: #ffb6c1;
            border: none;
            padding: 4px 7px;
            border-radius: 8px;
            font-size: 9.5px;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-weight: 500;
            white-space: nowrap;
        }
        .copy-btn:active {
            background: #ff69b4;
            color: #fff;
        }

        .chat-footer {
            padding: 8px 12px 10px 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #ffe4e1;
            flex-shrink: 0;
            z-index: 2;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #fff0f5;
            border-radius: 18px;
            padding: 4px 10px;
            gap: 6px;
            border: 1px solid #ffb6c1;
        }

        .camera-circle-btn {
            width: 24px;
            height: 24px;
            background: #ffb6c1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 10px;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            font-size: 12px;
            color: #b03060;
            outline: none;
            border: none;
            background: transparent;
            font-family: 'Prompt', sans-serif;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #ff69b4;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            padding: 2px 4px;
        }

        /* ขอบล่าง iPhone 6 พร้อมปุ่มโฮม */
        .iphone6-bottom-bezel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #fff9fb;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 0.5px solid #ffe4e1;
        }

        .home-button-ring {
            width: 44px;
            height: 44px;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 3px rgba(255,182,193,0.3);
        }
    </style>
</head>
<body>

    <div class="iphone-device">
        <div class="side-button silent-switch"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <div class="iphone-screen-frame">
            
            <div class="iphone6-top-bezel">
                <div class="sensor-row">
                    <div class="camera-dot"></div>
                    <div class="speaker-slot"></div>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-left">
                    <i class="fas fa-signal" style="font-size: 10px;"></i>
                    <span>AIS</span>
                    <i class="fas fa-wifi" style="font-size: 10px; margin-left: 2px;"></i>
                </div>
                <div class="status-center">
                    <span>07:25</span>
                </div>
                <div class="status-right">
                    <div class="battery-box">
                        <span>66%</span>
                        <i class="fas fa-battery-three-quarters" style="font-size: 12px;"></i>
                    </div>
                </div>
            </div>

            <div class="screen-content-area">
                <div class="chat-screen">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <i class="fas fa-chevron-left back-icon"></i>
                            <div class="chat-avatar-header">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="chat-user-meta">
                                <div class="name">wongsuda_shop ✨</div>
                                <div class="status">Active 5m ago</div>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <i class="fas fa-phone"></i>
                            <i class="fas fa-video"></i>
                            <i class="fas fa-circle-info"></i>
                        </div>
                    </div>

                    <!-- พื้นที่เนื้อหาแชทแบบกระจายตัวพอดีหน้าจอ -->
                    <div class="chat-body">
                        <div class="chat-flow-container">
                            <!-- ข้อความทักทาย -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        สวัสดีค่ะคุณลูกค้า สนใจบริการตัวแทนดันกลุ่ม สอบถามรายละเอียดได้เลยน้า 💖🌷
                                    </div>
                                </div>
                            </div>

                            <!-- ข้อความฝั่งเราส่ง -->
                            <div class="message sent">
                                ขอช่องทางการโอนหน่อยค้าบ
                            </div>

                            <!-- รูปภาพ QR / สลิป -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="image-message-box">
                                    <div class="image-container">
                                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&fit=crop" alt="Shared Image">
                                    </div>
                                </div>
                            </div>

                            <!-- ข้อความแจ้งบัญชีธนาคาร -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยนะค้าบ 👇
                                    </div>

                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-university" style="color:#d87093;"></i> กสิกรไทย (KBANK)</div>
                                            <div class="num">123-4-56789-0</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                    </div>

                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-wallet" style="color:#ff69b4;"></i> TrueMoney Wallet</div>
                                            <div class="num">081-234-5678</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ตัวเว้นพื้นที่ด้านล่างให้สมดุล -->
                        <div></div>
                    </div>

                    <div class="chat-footer">
                        <div class="chat-input-wrapper">
                            <div class="camera-circle-btn">
                                <i class="fas fa-camera"></i>
                            </div>
                            <input type="text" class="chat-input-field" value="ขอช่องทางการโอนหน่อยค้าบ">
                            <button class="send-btn">ส่ง</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="iphone6-bottom-bezel">
                <div class="home-button-ring"></div>
            </div>

        </div>
    </div>

    <script>
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 1500);
            });
        }
    </script>

</body>
</html>
