<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Minimal iPhone 11 Chat Mockup</title>
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fcf6f8; /* พื้นหลังสีชมพูอ่อนจางๆ */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ตัวเครื่อง iPhone 11 (ขนาดสเกลสมจริง & สีชมพูพาสเทลละมุน) --- */
        .iphone-device {
            position: relative;
            width: 415px;
            height: 855px;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            border-radius: 54px;
            box-shadow: 
                0 25px 50px rgba(244, 143, 177, 0.3),
                inset 0 0 2px 2px rgba(255, 255, 255, 0.9),
                inset 0 0 0 5px #f48fb1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มด้านข้าง iPhone 11 */
        .side-button {
            position: absolute;
            background: #f06292;
            border-radius: 3px;
        }
        .volume-up { left: -8px; top: 165px; width: 4px; height: 32px; }
        .volume-down { left: -8px; top: 215px; width: 4px; height: 32px; }
        .power-button { right: -8px; top: 190px; width: 4px; height: 65px; }

        /* กรอบหน้าจอสีขาวขอบมน (iPhone 11 Screen) */
        .iphone-screen-frame {
            position: relative;
            width: 387px;
            height: 827px;
            background-color: #ffffff;
            border-radius: 46px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 4px solid #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        /* รอยบาก iPhone 11 (Notch) ขอบขาว */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 155px;
            height: 28px;
            background-color: #ffffff;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .speaker {
            width: 50px;
            height: 4px;
            background-color: #e0deda;
            border-radius: 3px;
            position: absolute;
            top: 8px;
        }

        .camera {
            width: 10px;
            height: 10px;
            background-color: #222;
            border-radius: 50%;
            position: absolute;
            top: 7px;
            right: 32px;
        }

        /* --- หน้าจอแชทโทนชมพูพาสเทล --- */
        .chat-screen {
            background-color: #fff9fb;
            flex: 1;
            margin-top: 28px; /* เว้นระยะใต้รอยบาก */
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-screen::-webkit-scrollbar {
            display: none;
        }

        /* Header แชท */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #fce4ec;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            gap: 12px;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid #f8bbd0;
        }
        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 13px;
            font-weight: 600;
            color: #4a3b42;
        }
        .chat-user-meta .status {
            font-size: 11px;
            color: #b08d9b;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-user-meta .status::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #a8d5ba;
            border-radius: 50%;
            display: inline-block;
        }

        /* กล่องข้อความในแชท */
        .chat-body {
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: #ffffff;
            color: #4a3b42;
            align-self: flex-start;
            border: 1px solid #fce4ec;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 5px rgba(244, 143, 177, 0.05);
        }

        .message.sent {
            background: #fce4ec; /* ชมพูอ่อนพาสเทล */
            color: #5c3b48;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            font-weight: 400;
        }

        /* กล่อง QR Code แยกเป็นข้อความอิสระ */
        .qr-message-box {
            background: #ffffff;
            border: 1px solid #fce4ec;
            border-radius: 16px;
            padding: 12px;
            align-self: flex-start;
            max-width: 82%;
            box-shadow: 0 4px 12px rgba(244, 143, 177, 0.08);
            animation: fadeIn 0.35s ease;
        }

        .qr-container {
            width: 115px;
            height: 115px;
            margin: 0 auto 10px auto;
            background: #fff;
            padding: 6px;
            border: 1.5px dashed #f8bbd0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .bank-item {
            background: #fff5f8;
            padding: 9px 11px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border: 1px solid #fde2ec;
        }

        .bank-info .title {
            font-weight: 500;
            color: #8c6373;
            font-size: 11.5px;
            margin-bottom: 1px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #4a3b42;
            letter-spacing: 0.5px;
        }

        /* ปุ่มคัดลอกโทนชมพู */
        .copy-btn {
            background: #f8bbd0;
            border: none;
            padding: 5px 10px;
            border-radius: 7px;
            font-size: 11px;
            color: #5c3b48;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
        }
        .copy-btn:active {
            background: #f48fb1;
            transform: scale(0.95);
        }

        /* แถบกดส่งข้อความ / ปุ่มเลือกคำถาม */
        .chat-footer {
            padding: 12px 14px;
            background: #ffffff;
            border-top: 1px solid #fce4ec;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quick-reply-btn {
            background: #fff5f8;
            border: 1.5px solid #f8bbd0;
            color: #734858;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 2px 6px rgba(244, 143, 177, 0.05);
        }

        .quick-reply-btn:hover {
            background: #fce4ec;
        }

        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff5f8;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .chat-input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 12px;
            outline: none;
            font-family: 'Prompt', sans-serif;
            color: #734858;
        }

        .chat-input-bar i {
            font-size: 15px;
            color: #f48fb1;
            cursor: pointer;
        }

        /* ซ่อนกล่องข้อมูลบัญชีก่อนกดปุ่ม */
        #paymentReply {
            display: none;
        }

        /* Home Indicator (ขีดสีเทาจางๆ ด้านล่างจอไอโฟน 11) */
        .home-indicator {
            width: 130px;
            height: 4px;
            background-color: #d8d8d8;
            border-radius: 100px;
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- บอดี้ตัวเครื่อง iPhone 11 -->
    <div class="iphone-device">
        <!-- ปุ่มข้างเครื่อง -->
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอไอโฟน 11 -->
        <div class="iphone-screen-frame">
            <!-- Notch (รอยบาก) ด้านบน -->
            <div class="notch">
                <div class="speaker"></div>
                <div class="camera"></div>
            </div>

            <!-- หน้าจอแชทภายใน -->
            <div class="chat-screen">
                <!-- Header แชท -->
                <div class="chat-header">
                    <div class="chat-avatar">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                    </div>
                    <div class="chat-user-meta">
                        <div class="name">sananthachat_shop ☁️</div>
                        <div class="status">Active now</div>
                    </div>
                </div>

                <!-- ข้อความแชท -->
                <div class="chat-body" id="chatBody">
                    <div class="message received">
                        สวัสดีค่ะคุณลูกค้า สนใจสินค้าชิ้นไหนสอบถามได้เลยนะคะ 🤍✨
                    </div>

                    <!-- ข้อความที่จะโผล่มาเมื่อกดปุ่ม -->
                    <div id="paymentReply">
                        <div class="message sent" style="margin-bottom: 8px;">
                            ขอเลขบัญชีหน่อยค้าบ 🌷
                        </div>
                        <div class="message received" style="margin-bottom: 8px;">
                            ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยน้า 👇
                        </div>

                        <!-- แยกส่งรูป QR Code และบัญชีออกมาเป็นอีก 1 ข้อความ -->
                        <div class="qr-message-box">
                            <div class="qr-container">
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=1234567890" alt="QR Code">
                            </div>

                            <!-- บัญชีธนาคาร -->
                            <div class="bank-item">
                                <div class="bank-info">
                                    <div class="title"><i class="fas fa-university" style="color:#7892c4;"></i> กสิกรไทย (KBANK)</div>
                                    <div class="num" id="kbankNum">123-4-56789-0</div>
                                </div>
                                <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                            </div>

                            <!-- TrueMoney Wallet -->
                            <div class="bank-item" style="margin-bottom: 0;">
                                <div class="bank-info">
                                    <div class="title"><i class="fas fa-wallet" style="color:#f2a144;"></i> TrueMoney Wallet</div>
                                    <div class="num" id="walletNum">081-234-5678</div>
                                </div>
                                <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- แถบกดเลือกข้อความด่วน -->
                <div class="chat-footer">
                    <button class="quick-reply-btn" onclick="showPayment()">
                        <span>💬 ขอเลขบัญชีหน่อยค้าบ</span>
                        <i class="fas fa-paper-plane" style="font-size: 11px; color: #f48fb1;"></i>
                    </button>
                    
                    <div class="chat-input-bar">
                        <i class="far fa-image"></i>
                        <input type="text" placeholder="พิมพ์ข้อความ..." readonly>
                        <i class="far fa-smile"></i>
                    </div>
                </div>
            </div>

            <!-- Home Indicator ขีดด้านล่างจอไอโฟน 11 -->
            <div class="home-indicator"></div>
        </div>
    </div>

    <!-- Script ควบคุมการกดปุ่มและคัดลอก -->
    <script>
        function showPayment() {
            const paymentReply = document.getElementById('paymentReply');
            paymentReply.style.display = 'block';
            
            const chatBody = document.getElementById('chatBody');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                btn.style.background = '#f48fb1';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#f8bbd0';
                    btn.style.color = '#5c3b48';
                }, 1500);
            });
        }
    </script>

</body>
</html>
