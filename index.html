<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Messenger Light Mode Chat Mockup</title>
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ตัวเครื่อง iPhone 11 สมจริง --- */
        .iphone-device {
            position: relative;
            width: 410px;
            height: 840px;
            background: linear-gradient(135deg, #e4e6eb 0%, #bcc0c4 100%);
            border-radius: 52px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.2),
                inset 0 0 0 2px rgba(255, 255, 255, 0.8),
                inset 0 0 0 6px #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มด้านข้าง iPhone 11 */
        .side-button {
            position: absolute;
            background: #cbd5e1;
            border-radius: 4px;
        }
        .volume-up { left: -9px; top: 165px; width: 4px; height: 34px; }
        .volume-down { left: -9px; top: 215px; width: 4px; height: 34px; }
        .power-button { right: -9px; top: 190px; width: 4px; height: 70px; }

        /* กรอบหน้าจอสีดำด้านใน (Bezel) */
        .iphone-screen-frame {
            position: relative;
            width: 386px;
            height: 816px;
            background-color: #000000;
            border-radius: 42px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-shadow: inset 0 0 4px rgba(255,255,255,0.2);
        }

        /* หน้าจอแสดงผลด้านในสุด (สีขาว) */
        .screen-content-area {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Notch (รอยบาก) ด้านบน */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background-color: #000000;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .speaker {
            width: 45px;
            height: 4px;
            background-color: #333333;
            border-radius: 3px;
            position: absolute;
            top: 7px;
        }

        .camera {
            width: 10px;
            height: 10px;
            background-color: #111111;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            right: 32px;
            border: 1px solid #222;
        }

        /* --- หน้าจอแชทสไตล์ Messenger (Light Mode) --- */
        .chat-screen {
            background-color: #ffffff;
            flex: 1;
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-screen::-webkit-scrollbar {
            display: none;
        }

        /* Header แชท Messenger (พื้นหลังขาว) */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #f0f2f5;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon {
            color: #0084ff;
            font-size: 18px;
            cursor: pointer;
        }

        .chat-avatar-header {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            background: #e4e6eb;
        }
        .chat-avatar-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 13px;
            font-weight: 600;
            color: #050505;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }
        .chat-user-meta .status {
            font-size: 11px;
            color: #65676b;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .chat-header-right i {
            color: #0084ff;
            font-size: 18px;
            cursor: pointer;
        }

        /* กล่องข้อความในแชท */
        .chat-body {
            padding: 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* จัดกลุ่มข้อความฝั่งซ้าย (มีรูปโปรไฟล์วงกลมด้านข้าง) */
        .message-row-received {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            align-self: flex-start;
            max-width: 85%;
            animation: fadeIn 0.35s ease;
        }

        .chat-avatar-msg {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .chat-avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .received-content-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ฟองข้อความฝั่งซ้าย (ผู้ขาย - สีเทาอ่อน Messenger) */
        .message.received {
            background: #f0f2f5;
            color: #050505;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            width: fit-content;
            width: -webkit-fit-content;
            word-wrap: break-word;
        }

        /* ฟองข้อความฝั่งขวา (ตัวเราเอง - สีฟ้า Messenger) */
        .message.sent {
            background: #0084ff;
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            align-self: flex-end;
            width: fit-content;
            width: -webkit-fit-content;
            font-weight: 400;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
        }

        /* กล่องรูปภาพในแชท */
        .image-message-box {
            background: #f0f2f5;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 6px;
            width: 210px;
            overflow: hidden;
        }

        .image-container {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e4e6eb;
        }

        .image-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        /* ฟองธนาคารฝั่งซ้าย */
        .bank-message-box {
            background: #f0f2f5;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 10px 14px;
            width: fit-content;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 12px;
        }

        .bank-info .title {
            font-weight: 500;
            color: #65676b;
            font-size: 11.5px;
            margin-bottom: 2px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #050505;
            letter-spacing: 0.5px;
        }

        /* ปุ่มคัดลอกโหมดสว่าง */
        .copy-btn {
            background: #e4e6eb;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #050505;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }
        .copy-btn:active {
            background: #0084ff;
            color: #fff;
            transform: scale(0.95);
        }

        /* แถบช่องพิมพ์ข้อความด้านล่าง */
        .chat-footer {
            padding: 8px 12px 12px 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #f0f2f5;
        }

        .footer-icons {
            display: flex;
            gap: 12px;
            color: #0084ff;
            font-size: 18px;
            align-items: center;
        }

        .chat-input-bar {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f0f2f5;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-input-bar span {
            flex: 1;
            font-size: 13px;
            color: #65676b;
        }

        .chat-input-bar i {
            font-size: 16px;
            color: #0084ff;
        }

        /* ซ่อนข้อมูลบัญชีก่อนกดปุ่ม */
        #paymentReply {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        /* Home Indicator (ขีดด้านล่างจอ iPhone) */
        .home-indicator {
            width: 120px;
            height: 4px;
            background-color: #000000;
            border-radius: 100px;
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <!-- บอดี้ตัวเครื่อง iPhone 11 -->
    <div class="iphone-device">
        <!-- ปุ่มข้างเครื่อง -->
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอสีดำ (Bezel) -->
        <div class="iphone-screen-frame">
            <!-- พื้นที่หน้าจอแสดงผล -->
            <div class="screen-content-area">
                <!-- Notch (รอยบาก) ด้านบน -->
                <div class="notch">
                    <div class="speaker"></div>
                    <div class="camera"></div>
                </div>

                <!-- หน้าจอแชทภายใน -->
                <div class="chat-screen">
                    <!-- Header แชท Messenger -->
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <i class="fas fa-chevron-left back-icon"></i>
                            <div class="chat-avatar-header">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="chat-user-meta">
                                <div class="name">ตัวแทนดันกลุ่ม wish (สัญญา 1 เดือนน)</div>
                                <div class="status">Wongsuda เพิ่งใช้งานเมื่อ 5 นาทีที่แล้ว</div>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <i class="fas fa-phone-alt"></i>
                            <i class="fas fa-video"></i>
                            <i class="fas fa-info-circle"></i>
                        </div>
                    </div>

                    <!-- ข้อความแชท -->
                    <div class="chat-body" id="chatBody">
                        <!-- ข้อความรูปภาพเริ่มต้น (ฝั่งซ้าย มีรูปโปรไฟล์) -->
                        <div class="message-row-received">
                            <div class="chat-avatar-msg">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="image-message-box">
                                <div class="image-container">
                                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&fit=crop" alt="Shared Image">
                                </div>
                            </div>
                        </div>

                        <!-- ข้อความที่จะโผล่มาเมื่อกดปุ่ม -->
                        <div id="paymentReply">
                            <!-- ข้อความที่เราส่งเอง (อยู่ฝั่งขวาสุด สีฟ้า Messenger) -->
                            <div class="message sent">
                                ขอเลขบัญชีหน่อยค้าบ 🌷
                            </div>

                            <!-- ข้อความร้านค้าตอบกลับ (ฝั่งซ้าย มีรูปโปรไฟล์) -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยน้า 👇
                                    </div>

                                    <!-- บัญชีธนาคารกสิกรไทย -->
                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-university" style="color:#2563eb;"></i> กสิกรไทย (KBANK)</div>
                                            <div class="num" id="kbankNum">123-4-56789-0</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                    </div>

                                    <!-- TrueMoney Wallet -->
                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-wallet" style="color:#f97316;"></i> TrueMoney Wallet</div>
                                            <div class="num" id="walletNum">081-234-5678</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- แถบช่องพิมพ์ข้อความด้านล่างสไตล์ Messenger -->
                    <div class="chat-footer">
                        <div class="footer-icons">
                            <i class="fas fa-circle-plus"></i>
                            <i class="fas fa-image"></i>
                            <i class="fas fa-microphone"></i>
                        </div>
                        <div class="chat-input-bar" onclick="showPayment()">
                            <span>ขอเลขบัญชีหน่อยค้าบ</span>
                            <i class="fas fa-thumbs-up"></i>
                        </div>
                    </div>
                </div>

                <!-- Home Indicator ขีดด้านล่างจอไอโฟน -->
                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมการกดปุ่มและคัดลอก -->
    <script>
        function showPayment() {
            const paymentReply = document.getElementById('paymentReply');
            paymentReply.style.display = 'flex';
            
            const chatBody = document.getElementById('chatBody');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                btn.style.background = '#0084ff';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#e4e6eb';
                    btn.style.color = '#050505';
                }, 1500);
            });
        }
    </script>

</body>
</html>
