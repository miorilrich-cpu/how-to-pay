<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute IG DM - iPhone 6 Style</title>
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fff0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ตัวเครื่อง iPhone 6 (มีขอบบน-ล่าง และปุ่มโฮม) --- */
        .iphone-device {
            position: relative;
            width: 395px;
            height: 780px;
            background: linear-gradient(135deg, #ffd1dc 0%, #ffb6c1 100%);
            border-radius: 48px;
            box-shadow: 
                0 30px 60px rgba(255, 182, 193, 0.4),
                inset 0 0 0 2px rgba(255, 255, 255, 0.9),
                inset 0 0 0 5px #ffc0cb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มด้านข้าง iPhone 6 */
        .side-button {
            position: absolute;
            background: #ffb6c1;
            border-radius: 3px;
        }
        .volume-up { left: -7px; top: 140px; width: 3px; height: 30px; }
        .volume-down { left: -7px; top: 185px; width: 3px; height: 30px; }
        .silent-switch { left: -7px; top: 95px; width: 3px; height: 20px; }
        .power-button { right: -7px; top: 150px; width: 3px; height: 45px; }

        /* กรอบหน้าจอสีขาว/ดำด้านใน (Bezel ของ iPhone 6 ทรงดั้งเดิม) */
        .iphone-screen-frame {
            position: relative;
            width: 365px;
            height: 752px;
            background-color: #ffffff;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.1);
        }

        /* ขอบลำโพงและกล้องหน้าด้านบนของ iPhone 6 */
        .iphone6-top-speaker {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 0.5px solid #ffe4e1;
        }

        .sensor-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .camera-dot {
            width: 10px;
            height: 10px;
            background-color: #333333;
            border-radius: 50%;
        }

        .speaker-slit {
            width: 50px;
            height: 4px;
            background-color: #cccccc;
            border-radius: 3px;
        }

        /* Status Bar จำลองตามเรฟเฟอเรนซ์ (ไอคอนเครือข่าย แบต 46%) */
        .status-bar-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 11px;
            color: #666666;
            font-weight: 500;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* หน้าจอแสดงผลด้านในสุด */
        .screen-content-area {
            position: relative;
            width: 100%;
            flex: 1;
            margin-top: 48px;
            margin-bottom: 50px; /* เว้นที่ให้ปุ่มโฮมด้านล่าง */
            background-color: #fff9fb;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- หน้าจอแชท (ข้อมูลเดิมทั้งหมด 100% ไม่ถูกแก้) --- */
        .chat-screen {
            background-color: #fff9fb;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-screen::-webkit-scrollbar {
            display: none;
        }

        /* Header แชท */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #ffe4e1;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon {
            color: #ff69b4;
            font-size: 16px;
            cursor: pointer;
        }

        .chat-avatar-header {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            background: #ffe4e1;
            flex-shrink: 0;
            border: 1.5px solid #ffb6c1;
        }
        .chat-avatar-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 13px;
            font-weight: 600;
            color: #db7093;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }
        .chat-user-meta .status {
            font-size: 10px;
            color: #d8bfd8;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .chat-header-right i {
            color: #ff69b4;
            font-size: 16px;
            cursor: pointer;
        }

        /* กล่องข้อความในแชท */
        .chat-body {
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        /* จัดกลุ่มข้อความฝั่งซ้าย */
        .message-row-received {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            align-self: flex-start;
            max-width: 85%;
            animation: fadeIn 0.35s ease;
        }

        .chat-avatar-msg {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
            border: 1px solid #ffb6c1;
        }
        .chat-avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .received-content-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ฟองข้อความฝั่งซ้าย */
        .message.received {
            background: #ffe4e1;
            color: #555555;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            width: fit-content;
            width: -webkit-fit-content;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.15);
        }

        /* ฟองข้อความฝั่งขวา */
        .message.sent {
            background: linear-gradient(135deg, #ff8da1 0%, #d8b4fe 100%);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
            font-size: 13px;
            line-height: 1.4;
            align-self: flex-end;
            width: fit-content;
            width: -webkit-fit-content;
            font-weight: 400;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(255, 141, 161, 0.3);
        }

        /* กล่องรูปภาพโปรโมชันในแชท (ซ่อนไว้ก่อน) */
        #interactiveContent {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .image-message-box {
            background: #ffe4e1;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 6px;
            width: 210px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.15);
        }

        .image-container {
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .image-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }

        /* ฟองธนาคารฝั่งซ้าย */
        .bank-message-box {
            background: #ffe4e1;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 10px 14px;
            width: fit-content;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.15);
        }

        .bank-info .title {
            font-weight: 500;
            color: #b76e79;
            font-size: 11.5px;
            margin-bottom: 2px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
            letter-spacing: 0.5px;
        }

        /* ปุ่มคัดลอก */
        .copy-btn {
            background: #ffb6c1;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
            box-shadow: 0 2px 4px rgba(255, 182, 193, 0.4);
        }
        .copy-btn:active {
            background: #ff69b4;
            transform: scale(0.95);
        }

        /* แถบช่องพิมพ์ข้อความด้านล่าง */
        .chat-footer {
            padding: 8px 12px 14px 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #ffe4e1;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #fff0f5;
            border: 1px solid #ffb6c1;
            border-radius: 22px;
            padding: 6px 12px;
            gap: 10px;
        }

        .camera-circle-btn {
            width: 28px;
            height: 28px;
            background: #ffb6c1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            font-size: 13px;
            color: #555555;
            outline: none;
            border: none;
            background: transparent;
            font-family: 'Prompt', sans-serif;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #ff69b4;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            padding: 2px 6px;
            transition: opacity 0.2s;
        }
        .send-btn:active {
            opacity: 0.6;
        }

        /* ขอบล่าง iPhone 6 พร้อมปุ่มโฮมวงกลม */
        .iphone6-bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 0.5px solid #ffe4e1;
        }

        .home-button-circle {
            width: 36px;
            height: 36px;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            background: #fff9fb;
            cursor: pointer;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- บอดี้ตัวเครื่อง iPhone 6 -->
    <div class="iphone-device">
        <!-- ปุ่มข้างเครื่อง -->
        <div class="side-button silent-switch"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอ (Bezel) -->
        <div class="iphone-screen-frame">
            
            <!-- ขอบบน iPhone 6 (ลำโพง กล้อง และ Status Bar) -->
            <div class="iphone6-top-speaker">
                <div class="sensor-row">
                    <div class="camera-dot"></div>
                    <div class="speaker-slit"></div>
                </div>
                <div class="status-bar-top">
                    <span>14:49</span>
                    <div class="status-right">
                        <i class="fas fa-signal" style="font-size: 10px;"></i>
                        <i class="fas fa-wifi" style="font-size: 10px;"></i>
                        <span>46% <i class="fas fa-battery-three-quarters"></i></span>
                    </div>
                </div>
            </div>

            <!-- พื้นที่หน้าจอแสดงผลตรงกลาง -->
            <div class="screen-content-area">
                <div class="chat-screen">
                    <!-- Header แชท -->
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <i class="fas fa-chevron-left back-icon"></i>
                            <div class="chat-avatar-header">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="chat-user-meta">
                                <div class="name">wongsuda_shop ✨</div>
                                <div class="status">Active 5m ago</div>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <i class="fas fa-phone"></i>
                            <i class="fas fa-video"></i>
                            <i class="fas fa-circle-info"></i>
                        </div>
                    </div>

                    <!-- ข้อความแชท -->
                    <div class="chat-body" id="chatBody">
                        <!-- ข้อความต้อนรับเริ่มต้นจากร้านค้า -->
                        <div class="message-row-received">
                            <div class="chat-avatar-msg">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="received-content-group">
                                <div class="message received">
                                    สวัสดีค่ะคุณลูกค้า สนใจบริการตัวแทนดันกลุ่ม สอบถามรายละเอียดได้เลยน้า 💖🌷
                                </div>
                            </div>
                        </div>

                        <!-- ส่วนที่จะแสดงผลหลังจากกดปุ่มส่งข้อความ -->
                        <div id="interactiveContent">
                            <!-- ข้อความที่เราส่งออกไปฝั่งขวา -->
                            <div class="message sent" id="sentMessageBubble">
                                ขอช่องทางการโอนหน่อยค้าบ
                            </div>

                            <!-- รูปภาพโปรโมชันที่โผล่มาหลังจากกดส่ง -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="image-message-box">
                                    <div class="image-container">
                                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&fit=crop" alt="Shared Image">
                                    </div>
                                </div>
                            </div>

                            <!-- ข้อความร้านค้าตอบกลับพร้อมเลขบัญชี -->
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยนะค้าบ 👇
                                    </div>

                                    <!-- บัญชีธนาคารกสิกรไทย -->
                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-university" style="color:#2563eb;"></i> กสิกรไทย (KBANK)</div>
                                            <div class="num" id="kbankNum">123-4-56789-0</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                    </div>

                                    <!-- TrueMoney Wallet -->
                                    <div class="bank-message-box">
                                        <div class="bank-info">
                                            <div class="title"><i class="fas fa-wallet" style="color:#f97316;"></i> TrueMoney Wallet</div>
                                            <div class="num" id="walletNum">081-234-5678</div>
                                        </div>
                                        <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- แถบช่องพิมพ์ข้อความด้านล่าง -->
                    <div class="chat-footer">
                        <div class="chat-input-wrapper">
                            <div class="camera-circle-btn">
                                <i class="fas fa-camera"></i>
                            </div>
                            <input type="text" id="chatInput" class="chat-input-field" value="ขอช่องทางการโอนหน่อยค้าบ">
                            <button class="send-btn" onclick="sendMessage()">ส่ง</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ขอบล่าง iPhone 6 พร้อมปุ่มโฮม (Home Button) -->
            <div class="iphone6-bottom-bar">
                <div class="home-button-circle" onclick="sendMessage()"></div>
            </div>

        </div>
    </div>

    <!-- Script ควบคุมการทำงาน -->
    <script>
        function sendMessage() {
            const inputField = document.getElementById('chatInput');
            const textValue = inputField.value.trim();
            
            if(textValue === "") return;

            document.getElementById('sentMessageBubble').innerText = textValue;
            const interactiveContent = document.getElementById('interactiveContent');
            interactiveContent.style.display = 'flex';
            
            inputField.value = '';
            
            const chatBody = document.getElementById('chatBody');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                btn.style.background = '#ff69b4';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#ffb6c1';
                }, 1500);
            });
        }
    </script>

</body>
</html>
