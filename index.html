<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic iPhone 6 - Storefront with Banner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow: hidden;
        }

        .iphone-device {
            position: relative;
            width: 375px;
            height: 750px;
            background: linear-gradient(145deg, #ffffff 0%, #ffe5ec 100%);
            border-radius: 48px;
            box-shadow: 
                0 20px 40px rgba(255, 182, 193, 0.25),
                inset 0 0 0 2px #ffffff,
                inset 0 0 0 4px #ffb3c6;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: softSwing 5s ease-in-out infinite;
        }

        @keyframes softSwing {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(1.5deg); }
        }

        .side-button {
            position: absolute;
            background: #ffb3c6;
            border-radius: 2px;
        }
        .silent-switch { left: -4px; top: 90px; width: 3px; height: 18px; }
        .volume-up { left: -4px; top: 130px; width: 3px; height: 32px; }
        .volume-down { left: -4px; top: 175px; width: 3px; height: 32px; }
        .power-button { right: -4px; top: 135px; width: 3px; height: 45px; }

        .iphone-screen-frame {
            position: relative;
            width: 345px;
            height: 726px;
            background-color: #ffffff;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 6px rgba(255, 182, 193, 0.1);
        }

        .iphone6-top-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 0.5px solid #ffe4e6;
        }

        .sensor-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .camera-dot {
            width: 8px;
            height: 8px;
            background-color: #ffb3c6;
            border-radius: 50%;
        }

        .speaker-slot {
            width: 45px;
            height: 4px;
            background-color: #ffccd5;
            border-radius: 3px;
        }

        /* Status Bar: ซ้ายเครือข่าย, กลางนาฬิกา, ขวาแบตเตอรี่ */
        .status-bar {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: 24px;
            background-color: #ffffff;
            z-index: 119;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            font-weight: 500;
            color: #d87093;
            border-bottom: 0.5px solid #ffe4e6;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
        }

        .status-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.3px;
            z-index: 1;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
        }

        .battery-box {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .screen-content-area {
            position: relative;
            width: 100%;
            flex: 1;
            margin-top: 84px; 
            margin-bottom: 55px;
            background-color: #fff9fb;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .screen-content-area::-webkit-scrollbar {
            display: none;
        }

        /* ส่วนหัวหน้าร้าน: โลโก้อยู่มุมซ้ายบน */
        .store-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #ffffff;
            border-bottom: 1px solid #ffe4e6;
        }

        .store-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .store-avatar-box {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid #ff8fab;
            box-shadow: 0 2px 6px rgba(255, 143, 171, 0.2);
            flex-shrink: 0;
        }

        .store-avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .store-meta .store-title {
            font-size: 12px;
            font-weight: 600;
            color: #b55272;
            line-height: 1.2;
        }

        .store-meta .store-desc {
            font-size: 9.5px;
            color: #ff8fab;
        }

        .store-header-right i {
            color: #ff8fab;
            font-size: 14px;
            cursor: pointer;
        }

        /* ส่วนแบนเนอร์ร้านค้า (อัตราส่วนตามสัดส่วน 1122x495) */
        .store-banner-container {
            width: 100%;
            /* คำนวณความสูงตามสัดส่วน 1122x495 (495 / 1122 * 100% ≈ 44.1%) บนความกว้าง 345px */
            aspect-ratio: 1122 / 495;
            background: #ffe5ec;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #ffe4e6;
        }

        .store-banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ส่วนรายการสินค้า / เมนูบริการ */
        .section-container {
            padding: 12px 14px;
        }

        .section-title {
            font-size: 11.5px;
            font-weight: 600;
            color: #b55272;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .product-card {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #ffe4e6;
            box-shadow: 0 2px 8px rgba(255, 182, 193, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .product-card:active {
            transform: scale(0.97);
        }

        .product-img {
            width: 100%;
            height: 105px;
            background: #ffe5ec;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 9px;
        }

        .product-name {
            font-size: 11px;
            font-weight: 600;
            color: #b55272;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            font-size: 10px;
            color: #ff758c;
            font-weight: 600;
        }

        /* แถบเมนูด้านล่างหน้าจอ (Bottom Navigation) */
        .store-bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #ffffff;
            border-top: 1px solid #ffe4e6;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 118;
        }

        .nav-tab {
            background: none;
            border: none;
            cursor: pointer;
            color: #d1a1b0;
            font-size: 9px;
            text-align: center;
            flex: 1;
            font-family: 'Prompt', sans-serif;
            transition: color 0.2s;
        }

        .nav-tab i {
            font-size: 14px;
            display: block;
            margin-bottom: 2px;
        }

        .nav-tab.active {
            color: #ff758c;
            font-weight: 600;
        }

        .iphone6-bottom-bezel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #ffffff;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 0.5px solid #ffe4e6;
            pointer-events: none;
        }

        .home-button-ring {
            width: 42px;
            height: 42px;
            border: 2px solid #ffb3c6;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 2px rgba(255, 182, 193, 0.2);
            pointer-events: auto;
            transition: background 0.1s;
        }
        .home-button-ring:active {
            background: #fff0f3;
        }

        /* Modal แจ้งเตือนเมื่อกดสินค้า */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 240px;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.4);
            border: 1px solid #ffe4e6;
        }

        .modal-content h3 {
            font-size: 13px;
            color: #b55272;
            margin-bottom: 6px;
        }

        .modal-content p {
            font-size: 10.5px;
            color: #d1a1b0;
            margin-bottom: 14px;
        }

        .modal-btn {
            background: linear-gradient(135deg, #ff8fab 0%, #ffb3c6 100%);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 10.5px;
            font-weight: 500;
            font-family: 'Prompt', sans-serif;
        }

        .falling-star {
            position: absolute;
            color: #ffb3c6;
            font-size: 12px;
            animation: fallDown linear infinite;
            z-index: 130;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes fallDown {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translateY(750px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="iphone-device">
        <div class="side-button silent-switch"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <div class="iphone-screen-frame" id="iphoneScreen">
            
            <div class="iphone6-top-bezel">
                <div class="sensor-row">
                    <div class="camera-dot"></div>
                    <div class="speaker-slot"></div>
                </div>
            </div>

            <!-- Status Bar: ซ้ายเครือข่าย, กลางนาฬิกา, ขวาแบตเตอรี่ -->
            <div class="status-bar">
                <div class="status-left">
                    <i class="fas fa-signal" style="font-size: 9px;"></i>
                    <span>mean☘︎</span>
                    <i class="fas fa-wifi" style="font-size: 9px; margin-left: 2px;"></i>
                </div>
                <div class="status-center">
                    <span id="clock">19:09</span>
                </div>
                <div class="status-right">
                    <div class="battery-box">
                        <span>45%</span>
                        <i class="fas fa-battery-three-quarters" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <!-- หน้าจอเนื้อหาหน้าร้าน -->
            <div class="screen-content-area">
                <!-- ส่วนหัวหน้าร้าน: โลโก้อยู่มุมซ้ายบน -->
                <div class="store-header">
                    <div class="store-header-left">
                        <div class="store-avatar-box">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Store Logo">
                        </div>
                        <div class="store-meta">
                            <div class="store-title">miori_shop 💖</div>
                            <div class="store-desc">บริการ & ออกแบบตัวละคร</div>
                        </div>
                    </div>
                    <div class="store-header-right">
                        <i class="fas fa-bell" onclick="openModal('การแจ้งเตือน', 'ไม่มีการแจ้งเตือนใหม่ในขณะนี้ค่า ✨')"></i>
                    </div>
                </div>

                <!-- ส่วนแบนเนอร์ร้านค้า (อัตราส่วน 1122 x 495) อยู่ใต้โลโก้ทันที -->
                <div class="store-banner-container" onclick="openModal('ประกาศจากร้าน', 'ยินดีต้อนรับเข้าสู่ร้าน mori_shop ค่ะ สอบถามสินค้าทักแชทได้เลยน้า 💖')">
                    <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=1122&h=495&fit=crop" alt="Store Banner">
                </div>

                <!-- รายการสินค้า / บริการ -->
                <div class="section-container">
                    <div class="section-title">
                        <i class="fas fa-store" style="color: #ff758c;"></i> สินค้าและบริการแนะนำ
                    </div>

                    <div class="product-grid">
                        <div class="product-card" onclick="openModal('บริการดันกลุ่ม VIP', 'บริการตัวแทนดันกลุ่มและดูแลระบบกลุ่มแบบพรีเมียม ราคาพิเศษสุดๆ!')">
                            <div class="product-img">
                                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&h=300&fit=crop" alt="Service 1">
                            </div>
                            <div class="product-info">
                                <div class="product-name">บริการดันกลุ่ม VIP</div>
                                <div class="product-price">฿150 / เดือน</div>
                            </div>
                        </div>

                        <div class="product-card" onclick="openModal('Chibi Head Base', 'เทมเพลตฐานหัวตัวละคร Chibi ลายเส้นน่ารักใช้งานง่าย')">
                            <div class="product-img">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop" alt="Service 2">
                            </div>
                            <div class="product-info">
                                <div class="product-name">Chibi Head Base</div>
                                <div class="product-price">฿59.-</div>
                            </div>
                        </div>

                        <div class="product-card" onclick="openModal('Halloween Base Set', 'เบสโครงสร้างตัวละครพิเศษธีมฮาโลวีนสุดคิ้วท์')">
                            <div class="product-img">
                                <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=300&h=300&fit=crop" alt="Service 3">
                            </div>
                            <div class="product-info">
                                <div class="product-name">Halloween Base</div>
                                <div class="product-price">฿89.-</div>
                            </div>
                        </div>

                        <div class="product-card" onclick="openModal('Custom Request', 'สั่งทำพิเศษหรือสอบถามรายละเอียดเพิ่มเติมกับแอดมินได้เลยค่า')">
                            <div class="product-img">
                                <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=300&h=300&fit=crop" alt="Service 4">
                            </div>
                            <div class="product-info">
                                <div class="product-name">Custom Request</div>
                                <div class="product-price">สอบถามราคา</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- แถบเมนูด้านล่างหน้าจอ (Bottom Navigation) -->
            <div class="store-bottom-nav">
                <button class="nav-tab active" onclick="switchTab(this)">
                    <i class="fas fa-home"></i>
                    <span>หน้าแรก</span>
                </button>
                <button class="nav-tab" onclick="switchTab(this); openModal('หมวดหมู่สินค้า', 'เลือกดูสินค้าทั้งหมดของทางร้านได้ที่นี่ค่ะ')">
                    <i class="fas fa-th-large"></i>
                    <span>สินค้า</span>
                </button>
                <button class="nav-tab" onclick="switchTab(this); openModal('ติดต่อเรา', 'ช่องทางติดต่อ: LINE หรือ Instagram miori_shop ค้าบ 💖')">
                    <i class="fas fa-comment-dots"></i>
                    <span>ติดต่อ</span>
                </button>
            </div>

            <div class="iphone6-bottom-bezel">
                <div class="home-button-ring" onclick="alert('กลับสู่หน้าแรกของร้านค้า 🏠')"></div>
            </div>

        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal" id="storeModal">
        <div class="modal-content">
            <h3 id="modalTitle">หัวข้อสินค้า</h3>
            <p id="modalDesc">รายละเอียดสินค้า...</p>
            <button class="modal-btn" onclick="closeModal()">ตกลง</button>
        </div>
    </div>

    <script>
        // อัปเดตเวลาแบบเรียลไทม์
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function openModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('storeModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('storeModal').style.display = 'none';
        }

        function switchTab(element) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
        }

        function createFallingStars() {
            const screenFrame = document.getElementById('iphoneScreen');
            const starCount = 10;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('falling-star', 'fa-solid', 'fa-star');
                star.style.left = Math.random() * 320 + 'px';
                star.style.top = -20 + 'px';
                star.style.fontSize = (Math.random() * 6 + 7) + 'px';
                star.style.animationDuration = (Math.random() * 5 + 5) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                screenFrame.appendChild(star);
            }
        }

        window.onload = function() {
            createFallingStars();
        };
    </script>

</body>
</html>
