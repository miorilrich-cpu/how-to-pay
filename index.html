<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic iPhone 6 - IG DM (Perfect Fit Chat Body)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow: hidden;
        }

        /* โครงตัวเครื่อง iPhone 6 คลาสสิก (เพิ่มแอนิเมชันส่ายไปมา) */
        .iphone-device {
            position: relative;
            width: 375px;
            height: 750px;
            background: linear-gradient(135deg, #fff0f5 0%, #ffcbf2 100%);
            border-radius: 48px;
            box-shadow: 
                0 25px 50px rgba(255, 182, 193, 0.3),
                inset 0 0 0 2px #ffffff,
                inset 0 0 0 4px #ffb3c6;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: softSwing 4s ease-in-out infinite;
        }

        @keyframes softSwing {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }

        /* ปุ่มด้านข้างตัวเครื่อง */
        .side-button {
            position: absolute;
            background: #ffb3c6;
            border-radius: 2px;
        }
        .silent-switch { left: -4px; top: 90px; width: 3px; height: 18px; }
        .volume-up { left: -4px; top: 130px; width: 3px; height: 32px; }
        .volume-down { left: -4px; top: 175px; width: 3px; height: 32px; }
        .power-button { right: -4px; top: 135px; width: 3px; height: 45px; }

        /* กรอบหน้าจอสีขาวด้านในแบบ iPhone 6 */
        .iphone-screen-frame {
            position: relative;
            width: 345px;
            height: 726px;
            background-color: #fff9fb;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 6px rgba(255, 192, 203, 0.2);
        }

        /* ขอบบน iPhone 6 (กล้อง + ลำโพง อยู่บนสุด) */
        .iphone6-top-bezel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #fff9fb;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 0.5px solid #ffe4e6;
        }

        .sensor-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .camera-dot {
            width: 9px;
            height: 9px;
            background-color: #ff8fab;
            border-radius: 50%;
        }

        .speaker-slot {
            width: 50px;
            height: 4px;
            background-color: #ffb3c6;
            border-radius: 3px;
        }

        /* แถบสถานะด้านบน (อยู่ใต้กล้อง/ลำโพง พอดี) */
        .status-bar {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: 24px;
            background-color: #fff9fb;
            z-index: 119;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            font-weight: 500;
            color: #d81159;
            border-bottom: 0.5px solid #ffe4e6;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .battery-box {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* พื้นที่แสดงผลแชท */
        .screen-content-area {
            position: relative;
            width: 100%;
            flex: 1;
            margin-top: 84px; 
            margin-bottom: 75px;
            background-color: #fff9fb;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* หน้าจอแชทภายใน */
        .chat-screen {
            background-color: #fff9fb;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: #ffffff;
            z-index: 10;
            border-bottom: 1px solid #ffe4e6;
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-icon {
            color: #ff758c;
            font-size: 15px;
            cursor: pointer;
        }

        .chat-avatar-header {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            background: #ffccd5;
            flex-shrink: 0;
        }
        .chat-avatar-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 12px;
            font-weight: 600;
            color: #d81159;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .chat-user-meta .status {
            font-size: 9px;
            color: #ff758c;
        }

        .chat-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-right i {
            color: #ff758c;
            font-size: 14px;
            cursor: pointer;
        }

        /* จัดระเบียบเนื้อหาแชทให้กระจายเต็มพื้นที่หน้าจอพอดี (Space Between) */
        .chat-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .chat-flow-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .message-row-received {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            align-self: flex-start;
            max-width: 85%;
            animation: fadeIn 0.35s ease;
        }

        .chat-avatar-msg {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .chat-avatar-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .received-content-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: #ffe4e6;
            color: #880e4f;
            padding: 8px 12px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            font-size: 12px;
            line-height: 1.35;
            width: fit-content;
            word-wrap: break-word;
        }

        .message.sent {
            background: #ff758c;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            font-size: 12px;
            line-height: 1.35;
            align-self: flex-end;
            width: fit-content;
            font-weight: 400;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
        }

        #interactiveContent {
            display: flex; /* แสดงผลข้อความที่ส่งทันที */
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* ปรับขนาดรูปภาพ เป็น 480*480 */
        .image-message-box {
            background: #ffe4e6;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            padding: 6px;
            width: 200px;
            overflow: hidden;
        }

        .image-container {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .image-container img {
            width: 480px;
            height: 480px;
            max-width: none;
            max-height: none;
            object-fit: cover;
            display: block;
        }

        /* ปรับส่วนช่องธนาคารและ Wallet ให้ใหญ่ขึ้น */
        .bank-message-box {
            background: #ffe4e6;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            padding: 12px 16px;
            width: 100%;
            max-width: 240px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            font-size: 12px;
        }

        .bank-info .title {
            font-weight: 600;
            color: #880e4f;
            font-size: 11px;
            margin-bottom: 3px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 700;
            color: #d81159;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: #ffb3c6;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #ffffff;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 600;
            white-space: nowrap;
        }
        .copy-btn:active {
            background: #ff758c;
            color: #fff;
        }

        .chat-footer {
            padding: 8px 12px 10px 12px;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #ffe4e6;
            flex-shrink: 0;
        }

        .chat-input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #ffe4e6;
            border-radius: 18px;
            padding: 4px 10px;
            gap: 6px;
        }

        .camera-circle-btn {
            width: 24px;
            height: 24px;
            background: #ffb3c6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 10px;
            flex-shrink: 0;
        }

        .chat-input-field {
            flex: 1;
            font-size: 12px;
            color: #880e4f;
            outline: none;
            border: none;
            background: transparent;
            font-family: 'Prompt', sans-serif;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: #ff758c;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            padding: 2px 4px;
        }

        /* ขอบล่าง iPhone 6 พร้อมปุ่มโฮมเกลี้ยงๆ */
        .iphone6-bottom-bezel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: #fff9fb;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 0.5px solid #ffe4e6;
        }

        .home-button-ring {
            width: 44px;
            height: 44px;
            border: 2px solid #ffb3c6;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 3px rgba(255, 182, 193, 0.2);
            transition: background 0.1s;
        }
        .home-button-ring:active {
            background: #ffe4e6;
        }

        /* เอฟเฟกต์ดาวโปรยปรายลงมา */
        .falling-star {
            position: absolute;
            color: #ffb3c6;
            font-size: 14px;
            animation: fallDown linear infinite;
            z-index: 130;
            pointer-events: none;
        }

        @keyframes fallDown {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(750px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="iphone-device">
        <!-- ปุ่มข้างตัวเครื่อง -->
        <div class="side-button silent-switch"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอโทรศัพท์ -->
        <div class="iphone-screen-frame" id="iphoneScreen">
            
            <!-- ขอบบน iPhone 6 (กล้อง + ลำโพง อยู่บนสุด) -->
            <div class="iphone6-top-bezel">
                <div class="sensor-row">
                    <div class="camera-dot"></div>
                    <div class="speaker-slot"></div>
                </div>
            </div>

            <!-- แถบสถานะด้านบน (อยู่ใต้กล้อง/ลำโพง พอดี) -->
            <div class="status-bar">
                <div class="status-left">
                    <i class="fas fa-signal" style="font-size: 10px;"></i>
                    <span>AIS</span>
                    <i class="fas fa-wifi" style="font-size: 10px; margin-left: 2px;"></i>
                </div>
                <div class="status-center">
                    <span>07:25</span>
                </div>
                <div class="status-right">
                    <div class="battery-box">
                        <span>66%</span>
                        <i class="fas fa-battery-three-quarters" style="font-size: 12px;"></i>
                    </div>
                </div>
            </div>

            <!-- พื้นที่เนื้อหาแชท -->
            <div class="screen-content-area">
                <div class="chat-screen">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <i class="fas fa-chevron-left back-icon"></i>
                            <div class="chat-avatar-header">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <div class="chat-user-meta">
                                <div class="name">wongsuda_shop ✨</div>
                                <div class="status">Active 5m ago</div>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <i class="fas fa-phone"></i>
                            <i class="fas fa-video"></i>
                            <i class="fas fa-circle-info"></i>
                        </div>
                    </div>

                    <div class="chat-body" id="chatBody">
                        <!-- ข้อความทักทายจากร้านค้า (อยู่บนสุด) -->
                        <div class="chat-flow-container">
                            <div class="message-row-received">
                                <div class="chat-avatar-msg">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                </div>
                                <div class="received-content-group">
                                    <div class="message received">
                                        สวัสดีค่ะคุณลูกค้า สนใจบริการตัวแทนดันกลุ่ม สอบถามรายละเอียดได้เลยน้า 💖🌷
                                    </div>
                                </div>
                            </div>

                            <div id="interactiveContent">
                                <!-- บัฟเบิลข้อความที่ส่งเปลี่ยนเป็น "ขอช่องทางการโอนหน่อยค้าบ" -->
                                <div class="message sent" id="sentMessageBubble">
                                    ขอช่องทางการโอนหน่อยค้าบ
                                </div>

                                <div class="message-row-received">
                                    <div class="chat-avatar-msg">
                                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                    </div>
                                    <div class="image-message-box">
                                        <div class="image-container">
                                            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=480&h=480&fit=crop" alt="Shared Image">
                                        </div>
                                    </div>
                                </div>

                                <div class="message-row-received">
                                    <div class="chat-avatar-msg">
                                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                                    </div>
                                    <div class="received-content-group">
                                        <div class="message received">
                                            ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยนะค้าบ 👇
                                        </div>

                                        <div class="bank-message-box">
                                            <div class="bank-info">
                                                <div class="title"><i class="fas fa-university" style="color:#d81159;"></i> กสิกรไทย (KBANK)</div>
                                                <div class="num">123-4-56789-0</div>
                                            </div>
                                            <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                        </div>

                                        <div class="bank-message-box">
                                            <div class="bank-info">
                                                <div class="title"><i class="fas fa-wallet" style="color:#ff758c;"></i> TrueMoney Wallet</div>
                                                <div class="num">081-234-5678</div>
                                            </div>
                                            <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ตัวเว้นพื้นที่ด้านล่างให้สมดุลพอดีหน้าจอ -->
                        <div></div>
                    </div>

                    <div class="chat-footer">
                        <div class="chat-input-wrapper">
                            <div class="camera-circle-btn">
                                <i class="fas fa-plus"></i>
                            </div>
                            <!-- ช่องพิมพ์ข้อความด้านล่างเปลี่ยนเป็น "miori store" -->
                            <input type="text" id="chatInput" class="chat-input-field" value="miori store">
                            <button class="send-btn" onclick="sendMessage()">ส่ง</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ขอบล่าง iPhone 6 พร้อมปุ่มโฮมเกลี้ยงๆ -->
            <div class="iphone6-bottom-bezel">
                <div class="home-button-ring" onclick="sendMessage()"></div>
            </div>

        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('chatInput');
            const textValue = inputField.value.trim();
            if(textValue === "") return;

            // นำข้อความจากช่องพิมพ์มาแสดงในบับเบิลข้อความที่ส่งทันที
            document.getElementById('sentMessageBubble').innerText = textValue;
            document.getElementById('interactiveContent').style.display = 'flex';
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                setTimeout(() => {
                    btn.innerText = originalText;
                }, 1500);
            });
        }

        // ฟังก์ชันสร้างดาวโปรยปรายในหน้าจอ
        function createFallingStars() {
            const screenFrame = document.getElementById('iphoneScreen');
            const starCount = 12;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('falling-star', 'fa-solid', 'fa-star');
                star.style.left = Math.random() * 320 + 'px';
                star.style.top = -20 + 'px';
                star.style.fontSize = (Math.random() * 8 + 8) + 'px';
                star.style.animationDuration = (Math.random() * 4 + 4) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                screenFrame.appendChild(star);
            }
        }

        // เรียกใช้งานฟังก์ชันสร้างดาวเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            createFallingStars();
        };
    </script>

</body>
</html>
