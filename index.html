<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Soft Chat - iPhone 6</title>
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #f7f4ee; /* พื้นหลังสีครีมอ่อนๆ สไตล์มินิมอล */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ตัวเครื่อง iPhone 6 (โทนสตาร์ไลท์/เงินละมุน) --- */
        .iphone-device {
            position: relative;
            width: 395px;
            height: 790px;
            background: linear-gradient(135deg, #f0eee9 0%, #dedad3 100%);
            border-radius: 44px;
            box-shadow: 
                0 25px 50px rgba(180, 175, 165, 0.25),
                inset 0 0 2px 2px rgba(255, 255, 255, 0.9),
                inset 0 0 0 4px #cfccc6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มด้านข้าง */
        .side-button {
            position: absolute;
            background: #c5c2bc;
            border-radius: 2px;
        }
        .volume-up { left: -6px; top: 155px; width: 3px; height: 28px; }
        .volume-down { left: -6px; top: 198px; width: 3px; height: 28px; }
        .silent-switch { left: -6px; top: 115px; width: 3px; height: 18px; }
        .power-button { right: -6px; top: 165px; width: 3px; height: 45px; }

        /* กรอบหน้าจอ */
        .iphone-screen-frame {
            position: relative;
            width: 367px;
            height: 745px;
            background-color: #ffffff;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 3px solid #222222;
        }

        /* หัวเครื่อง iPhone 6 */
        .iphone-header-sensor {
            background-color: #ffffff;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-bottom: 1px solid #f7f5f0;
            flex-shrink: 0;
            z-index: 100;
        }
        .speaker-i6 { width: 45px; height: 4px; background-color: #e0deda; border-radius: 2px; position: absolute; top: 16px; }
        .camera-i6 { width: 8px; height: 8px; background-color: #333; border-radius: 50%; position: absolute; top: 14px; left: 125px; }

        /* --- หน้าจอแชท --- */
        .chat-screen {
            background-color: #fbf9f5; /* พื้นหลังแชทสีขาวครีมนวลๆ */
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-screen::-webkit-scrollbar {
            display: none;
        }

        /* Header แชท */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0ece4;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            gap: 12px;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #f0ece4;
        }
        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 13px;
            font-weight: 600;
            color: #4a453f;
        }
        .chat-user-meta .status {
            font-size: 11px;
            color: #a39b90;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-user-meta .status::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #a8d5ba; /* จุดเขียวออนไลน์พาสเทล */
            border-radius: 50%;
            display: inline-block;
        }

        /* กล่องข้อความในแชท */
        .chat-body {
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: #ffffff;
            color: #4a453f;
            align-self: flex-start;
            border: 1px solid #f0ece4;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .message.sent {
            background: #f3ece1; /* สีชาไทยนมละมุนๆ */
            color: #4a4238;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            font-weight: 400;
        }

        /* การ์ดข้อมูลบัญชีและ QR Code มินิมอล */
        .payment-box {
            background: #ffffff;
            border: 1px solid #ede7df;
            border-radius: 16px;
            padding: 14px;
            margin-top: 6px;
            box-shadow: 0 4px 12px rgba(180, 170, 160, 0.08);
        }

        .qr-container {
            width: 115px;
            height: 115px;
            margin: 0 auto 12px auto;
            background: #fff;
            padding: 6px;
            border: 1.5px dashed #dcd4cc;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .bank-item {
            background: #faf8f5;
            padding: 9px 11px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border: 1px solid #f4f0eb;
        }

        .bank-info .title {
            font-weight: 500;
            color: #6c635b;
            font-size: 11.5px;
            margin-bottom: 1px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #3b352f;
            letter-spacing: 0.5px;
        }

        /* ปุ่มคัดลอกสไตล์มินิมอล */
        .copy-btn {
            background: #e8dccb;
            border: none;
            padding: 5px 10px;
            border-radius: 7px;
            font-size: 11px;
            color: #4a4238;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
        }
        .copy-btn:active {
            background: #d8ccc0;
            transform: scale(0.95);
        }

        /* แถบกดส่งข้อความ / ปุ่มเลือกคำถาม */
        .chat-footer {
            padding: 12px 14px;
            background: #ffffff;
            border-top: 1px solid #f0ece4;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quick-reply-btn {
            background: #fcfaf7;
            border: 1.5px solid #e8decb;
            color: #5c5248;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .quick-reply-btn:hover {
            background: #f5efe6;
            border-color: #dfd2be;
        }

        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f7f4ee;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .chat-input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 12px;
            outline: none;
            font-family: 'Prompt', sans-serif;
            color: #6c635b;
        }

        .chat-input-bar i {
            font-size: 15px;
            color: #b5aba1;
            cursor: pointer;
        }

        /* ซ่อนกล่องข้อมูลบัญชีก่อนกดปุ่ม */
        #paymentReply {
            display: none;
        }

        /* ปุ่ม Home วงกลม iPhone 6 ด้านล่าง */
        .iphone-home-footer {
            height: 50px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #f7f5f0;
            flex-shrink: 0;
        }

        .home-button {
            width: 34px;
            height: 34px;
            border: 2px solid #dedad3;
            border-radius: 50%;
            background: #fff;
            position: relative;
        }
        .home-button::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px;
            border: 1.5px solid #dedad3;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- บอดี้ตัวเครื่อง iPhone 6 -->
    <div class="iphone-device">
        <div class="side-button silent-switch"></div>
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอ -->
        <div class="iphone-screen-frame">
            <div class="iphone-header-sensor">
                <div class="speaker-i6"></div>
                <div class="camera-i6"></div>
            </div>

            <!-- หน้าจอแชทภายใน -->
            <div class="chat-screen">
                <!-- Header แชท -->
                <div class="chat-header">
                    <div class="chat-avatar">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                    </div>
                    <div class="chat-user-meta">
                        <div class="name">sananthachat_shop ☁️</div>
                        <div class="status">Active now</div>
                    </div>
                </div>

                <!-- ข้อความแชท -->
                <div class="chat-body" id="chatBody">
                    <div class="message received">
                        สวัสดีค่ะคุณลูกค้า สนใจสินค้าชิ้นไหนสอบถามได้เลยนะคะ 🤍✨
                    </div>

                    <!-- ข้อความที่จะโผล่มาเมื่อกดปุ่ม -->
                    <div id="paymentReply">
                        <div class="message sent" style="margin-bottom: 10px;">
                            ขอเลขบัญชีหน่อยค้าบ 🌷
                        </div>
                        <div class="message received">
                            ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยน้า 👇
                            
                            <div class="payment-box">
                                <!-- รูป QR Code -->
                                <div class="qr-container">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=1234567890" alt="QR Code">
                                </div>

                                <!-- บัญชีธนาคาร -->
                                <div class="bank-item">
                                    <div class="bank-info">
                                        <div class="title"><i class="fas fa-university" style="color:#7892c4;"></i> กสิกรไทย (KBANK)</div>
                                        <div class="num" id="kbankNum">123-4-56789-0</div>
                                    </div>
                                    <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                                </div>

                                <!-- TrueMoney Wallet -->
                                <div class="bank-item" style="margin-bottom: 0;">
                                    <div class="bank-info">
                                        <div class="title"><i class="fas fa-wallet" style="color:#f2a144;"></i> TrueMoney Wallet</div>
                                        <div class="num" id="walletNum">081-234-5678</div>
                                    </div>
                                    <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- แถบกดเลือกข้อความด่วน -->
                <div class="chat-footer">
                    <button class="quick-reply-btn" onclick="showPayment()">
                        <span>💬 ขอเลขบัญชีหน่อยค้าบ</span>
                        <i class="fas fa-paper-plane" style="font-size: 11px; color: #b5aba1;"></i>
                    </button>
                    
                    <div class="chat-input-bar">
                        <i class="far fa-image"></i>
                        <input type="text" placeholder="พิมพ์ข้อความ..." readonly>
                        <i class="far fa-smile"></i>
                    </div>
                </div>
            </div>

            <!-- ปุ่ม Home วงกลม iPhone 6 -->
            <div class="iphone-home-footer">
                <div class="home-button"></div>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมการกดปุ่มและคัดลอก -->
    <script>
        function showPayment() {
            const paymentReply = document.getElementById('paymentReply');
            paymentReply.style.display = 'block';
            
            const chatBody = document.getElementById('chatBody');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                btn.style.background = '#d2c2b0';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#e8dccb';
                }, 1500);
            });
        }
    </script>

</body>
</html>
