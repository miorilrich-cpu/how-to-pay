<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Instagram Mockup - iPhone 11</title>
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fff0f3; /* พื้นหลังสีชมพูพาสเทลอ่อนๆ น่ารัก */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ตัวเครื่อง iPhone 11 สไตล์ Rose Gold น่ารักๆ --- */
        .iphone-device {
            position: relative;
            width: 415px;
            height: 855px;
            background: linear-gradient(135deg, #f7d6e0 0%, #e2b4c5 100%);
            border-radius: 54px;
            box-shadow: 
                0 25px 50px rgba(230, 160, 180, 0.4),
                inset 0 0 2px 2px rgba(255, 255, 255, 0.6),
                inset 0 0 0 6px #d8a1b6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มกดด้านข้างเครื่อง */
        .side-button {
            position: absolute;
            background: #d8a1b6;
            border-radius: 3px;
        }
        .volume-up {
            left: -8px;
            top: 165px;
            width: 4px;
            height: 32px;
        }
        .volume-down {
            left: -8px;
            top: 215px;
            width: 4px;
            height: 32px;
        }
        .power-button {
            right: -8px;
            top: 190px;
            width: 4px;
            height: 65px;
        }

        /* --- กรอบหน้าจอข้างใน --- */
        .iphone-screen-frame {
            position: relative;
            width: 387px;
            height: 827px;
            background-color: #ffffff;
            border-radius: 46px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 4px solid #fff;
        }

        /* รอยบาก iPhone 11 (Notch) */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 30px;
            background-color: #ffffff;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .speaker {
            width: 50px;
            height: 4px;
            background-color: #e5e5e5;
            border-radius: 3px;
            position: absolute;
            top: 8px;
        }

        .camera {
            width: 10px;
            height: 10px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            top: 7px;
            right: 35px;
        }

        /* --- ส่วนแสดงผลแอพ Instagram --- */
        .app-screen {
            background-color: #ffffff;
            flex: 1;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .app-screen::-webkit-scrollbar {
            display: none;
        }

        /* Header ของ IG สไตล์ละมุน */
        .ig-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #fce4ec;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .ig-logo {
            font-weight: 600;
            font-size: 22px;
            font-family: cursive, sans-serif;
            color: #ff6b8b;
            letter-spacing: 0.5px;
        }

        .ig-header-icons i {
            font-size: 20px;
            margin-left: 18px;
            cursor: pointer;
            color: #555;
        }

        /* โพสต์สไตล์ IG */
        .ig-post {
            background: #fff;
            margin-bottom: 15px;
            border-bottom: 1px solid #fce4ec;
        }

        /* ข้อมูลโปรไฟล์หัวโพสต์ */
        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
        }

        .post-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .post-username {
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }

        .post-more {
            font-size: 14px;
            color: #888;
            cursor: pointer;
        }

        /* รูปภาพขนาด 1:1 */
        .post-image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #fff5f7;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* แถบปุ่มแอคชั่นใต้รูป */
        .post-actions {
            display: flex;
            justify-content: space-between;
            padding: 12px 14px 6px 14px;
        }

        .post-actions-left {
            display: flex;
            gap: 16px;
        }

        .post-actions i {
            font-size: 22px;
            cursor: pointer;
            color: #444;
        }

        .post-actions i.fa-heart {
            color: #ff4757; /* หัวใจสีแดงสดใส */
        }

        /* ยอดไลก์ */
        .post-likes {
            padding: 0 14px;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        /* ส่วนคอมเมนต์และบัญชีโอนเงินแบบน่ารัก */
        .post-comments {
            padding: 0 14px 14px 14px;
            font-size: 13px;
        }

        .comment-item {
            margin-bottom: 8px;
            line-height: 1.4;
            color: #555;
        }

        .comment-user {
            font-weight: 600;
            color: #ff6b8b;
            margin-right: 6px;
        }

        /* การ์ดเลขบัญชีสไตล์พาสเทลโค้งมน */
        .payment-card {
            background: #fff9fb;
            border: 1.5px dashed #ffb6c1;
            padding: 10px 12px;
            border-radius: 12px;
            margin-top: 8px;
            font-size: 12px;
            box-shadow: 0 2px 6px rgba(255, 182, 193, 0.15);
        }

        .payment-card.wallet {
            background: #fffaf0;
            border-color: #ffd1a9;
        }

        .payment-title {
            font-weight: 600;
            color: #d63384;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .payment-card.wallet .payment-title {
            color: #e8590c;
        }

        .payment-detail {
            color: #333;
            font-family: monospace;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .payment-name {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }

        /* แถบเมนูด้านล่างสุดของ IG */
        .ig-navbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 52px;
            border-top: 1px solid #fce4ec;
            background: #fff;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        .ig-navbar i {
            font-size: 20px;
            color: #555;
            cursor: pointer;
        }
        
        .ig-navbar i.active {
            color: #ff6b8b;
        }

        /* Home Indicator ขีดด้านล่างจอไอโฟน */
        .home-indicator {
            width: 134px;
            height: 5px;
            background-color: #ddd;
            border-radius: 100px;
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- บอดี้ตัวเครื่อง iPhone 11 (สี Rose Gold) -->
    <div class="iphone-device">
        <!-- ปุ่มข้างเครื่อง -->
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอเครื่อง -->
        <div class="iphone-screen-frame">
            <!-- Notch (รอยบาก) ด้านบน -->
            <div class="notch">
                <div class="speaker"></div>
                <div class="camera"></div>
            </div>

            <!-- หน้าจอแอพภายใน -->
            <div class="app-screen">
                <!-- IG Header -->
                <div class="ig-header">
                    <div class="ig-logo">Instagram ✨</div>
                    <div class="ig-header-icons">
                        <i class="far fa-heart"></i>
                        <i class="far fa-paper-plane"></i>
                    </div>
                </div>

                <!-- โพสต์ -->
                <div class="ig-post">
                    <div class="post-header">
                        <div class="post-user-info">
                            <div class="post-avatar">
                                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                            </div>
                            <span class="post-username">sananthachat_shop 🌸</span>
                        </div>
                        <div class="post-more"><i class="fas fa-ellipsis-h"></i></div>
                    </div>

                    <!-- รูปภาพ 1:1 -->
                    <div class="post-image-container">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&h=600&fit=crop" alt="Post Image">
                    </div>

                    <div class="post-actions">
                        <div class="post-actions-left">
                            <i class="fas fa-heart"></i>
                            <i class="far fa-comment"></i>
                            <i class="far fa-paper-plane"></i>
                        </div>
                        <div class="post-actions-right">
                            <i class="far fa-bookmark"></i>
                        </div>
                    </div>

                    <div class="post-likes">ถูกใจ 1,428 ครั้ง 💕</div>

                    <div class="post-comments">
                        <div class="comment-item">
                            <span class="comment-user">sananthachat_shop</span>ช่องทางการชำระเงินนะคะ งับผมมม 👇✨
                        </div>

                        <!-- ธนาคาร -->
                        <div class="payment-card">
                            <div class="payment-title">
                                <i class="fas fa-university"></i> ธนาคารกสิกรไทย (KBANK)
                            </div>
                            <div class="payment-detail">123-4-56789-0</div>
                            <div class="payment-name">ชื่อบัญชี: น.ส. สนันธัช พลเยี่ยม</div>
                        </div>

                        <!-- วอเลท -->
                        <div class="payment-card wallet">
                            <div class="payment-title">
                                <i class="fas fa-wallet"></i> TrueMoney Wallet
                            </div>
                            <div class="payment-detail">081-234-5678</div>
                            <div class="payment-name">ชื่อบัญชี: สนันธัช พลเยี่ยม</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navbar ด้านล่างของไอจี -->
            <div class="ig-navbar">
                <i class="fas fa-home active"></i>
                <i class="fas fa-search"></i>
                <i class="far fa-plus-square"></i>
                <i class="far fa-file-video"></i>
                <i class="far fa-user-circle"></i>
            </div>

            <!-- Home Indicator ขีดด้านล่างจอไอโฟน -->
            <div class="home-indicator"></div>
        </div>
    </div>

</body>
</html>
