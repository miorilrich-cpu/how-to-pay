<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Pink Minimal iPhone 11 Chat Mockup</title>
    <!-- ไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ฟอนต์ Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: #fcf6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- ตัวเครื่อง iPhone 11 สมจริง (สัดส่วน 19.5:9 โค้งมนละมุน) --- */
        .iphone-device {
            position: relative;
            width: 410px;
            height: 840px;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            border-radius: 52px;
            /* เพิ่มมิติเงาและขอบโลหะชั้นนอกให้เหมือนเครื่องจริง */
            box-shadow: 
                0 30px 60px rgba(244, 143, 177, 0.35),
                inset 0 0 0 2px rgba(255, 255, 255, 0.8),
                inset 0 0 0 6px #f48fb1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ปุ่มด้านข้าง iPhone 11 */
        .side-button {
            position: absolute;
            background: #ec407a;
            border-radius: 4px;
        }
        .volume-up { left: -9px; top: 165px; width: 4px; height: 34px; }
        .volume-down { left: -9px; top: 215px; width: 4px; height: 34px; }
        .power-button { right: -9px; top: 190px; width: 4px; height: 70px; }

        /* กรอบหน้าจอสีดำด้านใน (Bezel) ให้สมจริงยิ่งขึ้น */
        .iphone-screen-frame {
            position: relative;
            width: 386px;
            height: 816px;
            background-color: #000000;
            border-radius: 42px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 10px; /* จำลองขอบดำรอบจอ */
            box-shadow: inset 0 0 4px rgba(255,255,255,0.2);
        }

        /* หน้าจอแสดงผลด้านในสุด (สีขาว) */
        .screen-content-area {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 35px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* รอยบาก iPhone 11 (Notch) แนบติดขอบบนสุดของจอจริง */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 25px;
            background-color: #000000;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .speaker {
            width: 45px;
            height: 4px;
            background-color: #333333;
            border-radius: 3px;
            position: absolute;
            top: 7px;
        }

        .camera {
            width: 10px;
            height: 10px;
            background-color: #111111;
            border-radius: 50%;
            position: absolute;
            top: 6px;
            right: 32px;
            border: 1px solid #222;
        }

        /* --- หน้าจอแชทโทนชมพูพาสเทล --- */
        .chat-screen {
            background-color: #fff9fb;
            flex: 1;
            margin-top: 25px; /* เว้นระยะใต้รอยบาก */
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
        }

        .chat-screen::-webkit-scrollbar {
            display: none;
        }

        /* Header แชท */
        .chat-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #fce4ec;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            gap: 12px;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid #f8bbd0;
        }
        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-user-meta .name {
            font-size: 13px;
            font-weight: 600;
            color: #4a3b42;
        }
        .chat-user-meta .status {
            font-size: 11px;
            color: #b08d9b;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-user-meta .status::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #a8d5ba;
            border-radius: 50%;
            display: inline-block;
        }

        /* กล่องข้อความในแชท */
        .chat-body {
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        /* ฟองข้อความปรับความกว้างพอดีตัวหนังสือ (Fit-content) */
        .message {
            max-width: 82%;
            width: fit-content;
            width: -webkit-fit-content;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            animation: fadeIn 0.35s ease;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received {
            background: #ffffff;
            color: #4a3b42;
            align-self: flex-start;
            border: 1px solid #fce4ec;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 5px rgba(244, 143, 177, 0.05);
        }

        .message.sent {
            background: #fce4ec;
            color: #5c3b48;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            font-weight: 400;
        }

        /* กล่อง QR Code แยกเป็นฟองแชทเดี่ยว */
        .qr-message-box {
            background: #ffffff;
            border: 1px solid #fce4ec;
            border-radius: 16px;
            border-bottom-left-radius: 6px;
            padding: 12px;
            align-self: flex-start;
            width: fit-content;
            box-shadow: 0 4px 12px rgba(244, 143, 177, 0.08);
            animation: fadeIn 0.35s ease;
        }

        .qr-container {
            width: 115px;
            height: 115px;
            margin: 0 auto;
            background: #fff;
            padding: 6px;
            border: 1.5px dashed #f8bbd0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        /* ฟองแชทแยกสำหรับธนาคารแต่ละช่องทาง */
        .bank-message-box {
            background: #ffffff;
            border: 1px solid #fce4ec;
            border-radius: 16px;
            border-bottom-left-radius: 6px;
            padding: 10px 12px;
            align-self: flex-start;
            width: fit-content;
            box-shadow: 0 4px 12px rgba(244, 143, 177, 0.08);
            animation: fadeIn 0.35s ease;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 12px;
        }

        .bank-info .title {
            font-weight: 500;
            color: #8c6373;
            font-size: 11.5px;
            margin-bottom: 1px;
        }
        .bank-info .num {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #4a3b42;
            letter-spacing: 0.5px;
        }

        /* ปุ่มคัดลอกโทนชมพู */
        .copy-btn {
            background: #f8bbd0;
            border: none;
            padding: 5px 10px;
            border-radius: 7px;
            font-size: 11px;
            color: #5c3b48;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
        }
        .copy-btn:active {
            background: #f48fb1;
            transform: scale(0.95);
        }

        /* แถบช่องพิมพ์ข้อความด้านล่าง */
        .chat-footer {
            padding: 12px 14px;
            background: #ffffff;
            border-top: 1px solid #fce4ec;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff5f8;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1.5px solid #f8bbd0;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-input-bar:hover {
            background: #fce4ec;
        }

        .chat-input-bar span {
            flex: 1;
            font-size: 12px;
            color: #734858;
            font-weight: 400;
        }

        .chat-input-bar i {
            font-size: 14px;
            color: #f48fb1;
        }

        /* ซ่อนข้อมูลบัญชีก่อนกดปุ่ม */
        #paymentReply {
            display: none;
        }

        /* Home Indicator (ขีดสีเทาด้านล่างจอ iPhone) */
        .home-indicator {
            width: 120px;
            height: 4px;
            background-color: #d8d8d8;
            border-radius: 100px;
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- บอดี้ตัวเครื่อง iPhone 11 สมจริง -->
    <div class="iphone-device">
        <!-- ปุ่มข้างเครื่อง -->
        <div class="side-button volume-up"></div>
        <div class="side-button volume-down"></div>
        <div class="side-button power-button"></div>

        <!-- กรอบหน้าจอสีดำ (Bezel) -->
        <div class="iphone-screen-frame">
            <!-- พื้นที่หน้าจอแสดงผล -->
            <div class="screen-content-area">
                <!-- Notch (รอยบาก) ด้านบน -->
                <div class="notch">
                    <div class="speaker"></div>
                    <div class="camera"></div>
                </div>

                <!-- หน้าจอแชทภายใน -->
                <div class="chat-screen">
                    <!-- Header แชท -->
                    <div class="chat-header">
                        <div class="chat-avatar">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" alt="Avatar">
                        </div>
                        <div class="chat-user-meta">
                            <div class="name">sananthachat_shop ☁️</div>
                            <div class="status">Active now</div>
                        </div>
                    </div>

                    <!-- ข้อความแชท -->
                    <div class="chat-body" id="chatBody">
                        <div class="message received">
                            สวัสดีค่ะคุณลูกค้า สนใจสินค้าชิ้นไหนสอบถามได้เลยนะคะ 🤍✨
                        </div>

                        <!-- ข้อความที่จะโผล่มาเมื่อกดปุ่ม -->
                        <div id="paymentReply">
                            <div class="message sent" style="margin-bottom: 8px;">
                                ขอเลขบัญชีหน่อยค้าบ 🌷
                            </div>
                            <div class="message received" style="margin-bottom: 8px;">
                                ได้เลยค่ะคุณลูกค้า 😊 ช่องทางการชำระเงินตามนี้เลยน้า 👇
                            </div>

                            <!-- 1. ฟองแชทรูป QR Code เดี่ยวๆ -->
                            <div class="qr-message-box" style="margin-bottom: 8px;">
                                <div class="qr-container">
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=1234567890" alt="QR Code">
                                </div>
                            </div>

                            <!-- 2. ฟองแชทบัญชีธนาคารกสิกรไทย เดี่ยวๆ -->
                            <div class="bank-message-box" style="margin-bottom: 8px;">
                                <div class="bank-info">
                                    <div class="title"><i class="fas fa-university" style="color:#7892c4;"></i> กสิกรไทย (KBANK)</div>
                                    <div class="num" id="kbankNum">123-4-56789-0</div>
                                </div>
                                <button class="copy-btn" onclick="copyText('1234567890', this)">คัดลอก</button>
                            </div>

                            <!-- 3. ฟองแชท TrueMoney Wallet เดี่ยวๆ -->
                            <div class="bank-message-box">
                                <div class="bank-info">
                                    <div class="title"><i class="fas fa-wallet" style="color:#f2a144;"></i> TrueMoney Wallet</div>
                                    <div class="num" id="walletNum">081-234-5678</div>
                                </div>
                                <button class="copy-btn" onclick="copyText('0812345678', this)">คัดลอก</button>
                            </div>
                        </div>
                    </div>

                    <!-- แถบช่องพิมพ์ข้อความด้านล่าง -->
                    <div class="chat-footer">
                        <div class="chat-input-bar" onclick="showPayment()">
                            <span>ขอเลขบัญชีหน่อยค้าบ</span>
                            <i class="fas fa-paper-plane"></i>
                        </div>
                    </div>
                </div>

                <!-- Home Indicator ขีดด้านล่างจอไอโฟน -->
                <div class="home-indicator"></div>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมการกดปุ่มและคัดลอก -->
    <script>
        function showPayment() {
            const paymentReply = document.getElementById('paymentReply');
            paymentReply.style.display = 'block';
            
            const chatBody = document.getElementById('chatBody');
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                let originalText = btn.innerText;
                btn.innerText = 'คัดลอกแล้ว!';
                btn.style.background = '#f48fb1';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#f8bbd0';
                    btn.style.color = '#5c3b48';
                }, 1500);
            });
        }
    </script>

</body>
</html>
